# SonarQube Cloud's automatic analysis reads this file. It only says which files are product
# code and which are tests, so that test code is held to the rules for tests: a test fixture's
# address, throwaway password or temporary directory is not product code doing the same.
# Nothing is excluded from analysis and no rule is switched off here; a finding on product code
# that does not apply is marked in the Sonar UI with its reason.

# Everything in the repository is analysed: product code as sources, and the test trees (the C++
# suites, the load and soak drivers, the browser and cluster checks, their fixtures) and the
# Python checks' own unit tests as tests. A file is one or the other, never both.
sonar.sources=.
sonar.exclusions=tests/**,**/*_test.py
sonar.tests=.
sonar.test.inclusions=tests/**,**/*_test.py

sonar.sourceEncoding=UTF-8

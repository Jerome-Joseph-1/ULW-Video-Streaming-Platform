# SonarQube Cloud analysis in CI (docs/adr/0079), run by .github/workflows/sonar.yml on the Free
# plan for public repositories. Every setting here is one the Free plan offers. Automatic
# Analysis is off for this project; it would ignore this file.

sonar.organization=jerome-joseph-1
sonar.projectKey=Jerome-Joseph-1_ULW-Video-Streaming-Platform
sonar.projectName=ULW Video Streaming Platform

sonar.sourceEncoding=UTF-8

# Everything in the repository is analysed: product code as sources, and the test trees (the C++
# suites, the load and soak drivers, the browser and cluster checks, their fixtures) and the
# Python checks' own unit tests as tests, so that test code is held to the rules for tests. A
# file is one or the other, never both. No rule is switched off here; a finding on product code
# that does not apply is marked in the Sonar UI with its reason.
#
# Left out of both: the build tree (generated sources included) and the vendored tarballs. Files
# git ignores (fetched tools, node_modules, test results, Cargo target directories) are left out
# by the scanner already.
sonar.sources=.
sonar.exclusions=build/**,third_party/**,tests/**,**/*_test.py
sonar.tests=.
sonar.test.inclusions=tests/**,**/*_test.py

# C and C++: the compile database of the ci preset, built in the workflow before the scan
# (gcc-14, as reactor-matrix); each entry's -std=c++23 sets the analysed standard. A C or C++
# file the ci preset does not compile is not analysed: the fuzz targets (tests/fuzz, built
# only by the clang fuzz preset) and tools/io_uring_probe.c (compiled on its own in ci.yml).
# The analyser uses every core of the runner by default, so no thread count is set.
sonar.cfamily.compile-commands=build/ci/compile_commands.json

# Advisory: the gate shows on the dashboard and the pull request, and never fails the job.
sonar.qualitygate.wait=false

# --- Coverage hook -------------------------------------------------------------------------
# No coverage report exists on main yet, and this job does not build one. When a coverage job
# lands, point one of these at its report (built by that job, or downloaded from it):
#   GCC:   sonar.cfamily.gcov.reportsPath=<directory of .gcov files>
#   Clang: sonar.cfamily.llvm-cov.reportPath=<llvm-cov show output>
#   Either, via gcovr: sonar.coverageReportPaths=<gcovr --sonarqube XML>
# ------------------------------------------------------------------------------------------

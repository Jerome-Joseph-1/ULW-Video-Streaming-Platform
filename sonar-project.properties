# SonarQube Cloud analysis in CI (docs/adr/0079), run by .github/workflows/sonar.yml on the Free
# plan for public repositories. Every setting here is one the Free plan offers. Automatic
# Analysis is off for this project; it would ignore this file.

sonar.organization=jerome-joseph-1
sonar.projectKey=Jerome-Joseph-1_ULW-Video-Streaming-Platform
sonar.projectName=ULW Video Streaming Platform

sonar.sourceEncoding=UTF-8

# Everything in the repository is analysed: product code as sources, and the test trees (the C++
# suites, the load and soak drivers, the browser and cluster checks, their fixtures) and the
# unit tests that sit beside the code they test (Python's *_test.py, Go's *_test.go) as tests,
# so that test code is held to the rules for tests and is not counted as code to be covered. A
# file is one or the other, never both: each test pattern is in both lists below. No rule is
# switched off here; a finding on product code that does not apply is marked in the Sonar UI
# with its reason.
#
# Left out of both: the build tree (generated sources included) and the vendored tarballs. Files
# git ignores (fetched tools, node_modules, test results, Cargo target directories) are left out
# by the scanner already.
sonar.sources=.
sonar.exclusions=build/**,third_party/**,tests/**,**/*_test.py,**/*_test.go
sonar.tests=.
sonar.test.inclusions=tests/**,**/*_test.py,**/*_test.go

# C and C++: the compile database of the coverage preset (clang-19, Debug, source-based
# coverage), built in the workflow before the scan and the build whose tests are measured; each
# entry's -std=c++23 sets the analysed standard. A C or C++ file the coverage preset does not
# compile is not analysed: the fuzz targets (tests/fuzz, built only by the clang fuzz preset) and
# tools/io_uring_probe.c (compiled on its own in ci.yml). The analyser uses every core of the
# runner by default, so no thread count is set.
sonar.cfamily.compile-commands=build/coverage/compile_commands.json

# Coverage, written by the workflow before the scan (ADR-0079). C++: `llvm-cov show` text from
# tools/coverage.sh (COVERAGE_SONAR=1) over the unit and integration labels. Python: coverage.py
# XML from tools/coverage-python.sh over every *_test.py, with paths relative to this directory.
# Go: the cover profile from tools/coverage-go.sh over every Go module's tests; it names files by
# import path, which the Go analyser resolves through each module's go.mod.
sonar.cfamily.llvm-cov.reportPath=build/coverage/coverage/llvm-cov-show.txt
sonar.python.coverage.reportPaths=build/coverage-python.xml
sonar.go.coverage.reportPaths=build/coverage-go.out

# Advisory: the gate shows on the dashboard and the pull request, and never fails the job.
sonar.qualitygate.wait=false

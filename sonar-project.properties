# SonarQube Cloud analysis (docs/adr/0078), run by .github/workflows/sonar.yml on the Free plan
# for public repositories. Every setting here is one the Free plan offers.

# Placeholders: the values SonarQube Cloud generates when it imports this repository. Check
# both on the project's Information page after the import and correct them here if they differ.
sonar.organization=jerome-joseph-1
sonar.projectKey=Jerome-Joseph-1_ULW-Video-Streaming-Platform
sonar.projectName=ULW Video Streaming Platform

sonar.sourceEncoding=UTF-8
sonar.sources=apps,codec,core,http,infra,net,ops,os,rt,tools,deploy
sonar.tests=tests
# Build output, the vendored tarballs, fetched tools and dependencies, and test data.
sonar.exclusions=build/**,third_party/**,**/node_modules/**,**/target/**,\
  deploy/local/.tools/**,deploy/local/.state/**,tools/security/.tools/**
sonar.test.exclusions=tests/data/**,tests/fuzz/corpus/**,tests/call/.whipsink/**,\
  tests/e2e/test-results/**,tests/e2e/playwright-report/**,tests/e2e/.browsers/**,\
  tests/call/test-results/**

# C and C++: the compile database of the ci preset, built in the workflow before the scan
# (gcc-14, as reactor-matrix). The analysed standard comes from each entry's -std=c++23; this
# lets rules suggest C++23 features, not only those of older standards.
sonar.cfamily.compile-commands=build/ci/compile_commands.json
sonar.cfamily.reportingCppStandardOverride=c++23

# Advisory: the gate shows on the dashboard and the pull request, and never fails the job.
sonar.qualitygate.wait=false

# --- Coverage hook -------------------------------------------------------------------------
# No coverage report exists on main yet, and this job does not build one. When a coverage job
# lands, point one of these at its report (built by that job, or downloaded from it):
#   GCC:   sonar.cfamily.gcov.reportsPath=<directory of .gcov files>
#   Clang: sonar.cfamily.llvm-cov.reportPath=<llvm-cov show output>
#   Either, via gcovr: sonar.coverageReportPaths=<gcovr --sonarqube XML>
# ------------------------------------------------------------------------------------------

# Generates include/ulw/mls_ffi_bridge.h; the crate's tests check the committed copy.
language = "C"
header = "/* Generated by cbindgen from src/lib.rs. Do not edit: see ADR-0039. */"
include_guard = "ULW_MLS_FFI_BRIDGE_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

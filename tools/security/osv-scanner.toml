# Known vulnerabilities osv-scanner may report without failing the build (docs/adr/0072). Every
# entry names the advisory, why it does not apply or cannot be fixed yet, and an ignoreUntil at
# most a year out; past that date the advisory fails the build again until someone looks at it
# afresh. tools/security/check-allowlists.py enforces all three.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-03-31T00:00:00Z
reason = """paste 1.0.15 is unmaintained (an informational advisory, no vulnerability). It is a \
build-time proc macro in gst-plugins-rs's dependency tree (tests/call/whipsink/Cargo.lock), \
which builds the test publisher and ships nowhere. Revisit when whipsink moves to a release \
without it."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
ignoreUntil = 2027-03-31T00:00:00Z
reason = """proc-macro-error2 2.0.1 is unmaintained (an informational advisory, no \
vulnerability). It is a build-time proc macro reached through hax-lib-macros, libcrux-sha3, \
hpke-rs and openmls_rust_crypto in the OpenMLS bridge (infra/e2ee/mls_ffi_bridge), which the \
test and client harnesses link and no server does (ADR-0044), and in the browser client built \
from it (clients/web-mls), which runs in browsers (ADR-0098). Revisit when OpenMLS's crypto \
provider moves off it."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0330"
ignoreUntil = 2026-12-31T00:00:00Z
reason = """libcrux-kem 0.0.9 panics when encapsulating with a hybrid KEM key (X-Wing, \
X25519MlKem768) from a seed shorter than 32 bytes. The OpenMLS bridge \
(infra/e2ee/mls_ffi_bridge) and the browser client built from it (clients/web-mls) use only \
MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, so no hybrid key is ever built, and the seed \
comes from their own RNG. 0.0.10 fixes it but needs hpke-rs 0.8, which no openmls_rust_crypto \
release accepts yet (0.6.0 pins hpke 0.7). Bump when openmls_rust_crypto takes hpke-rs 0.8."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0331"
ignoreUntil = 2026-12-31T00:00:00Z
reason = """libcrux-kem 0.0.9 panics when decoding a too-short X25519MlKem768 or XWing hybrid \
KEM key. The OpenMLS bridge (infra/e2ee/mls_ffi_bridge) and the browser client built from it \
(clients/web-mls) use only MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, so neither decodes a \
hybrid key. 0.0.10 fixes it but needs hpke-rs 0.8, which no openmls_rust_crypto release \
accepts yet (0.6.0 pins hpke 0.7). Bump when openmls_rust_crypto takes hpke-rs 0.8."""

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-04-30T00:00:00Z
reason = """block-buffer 0.10.4 leaves its cursor corrupt, and later reads and writes out of \
bounds, if the block function it calls panics and the panic is caught. In the OpenMLS bridge \
(infra/e2ee/mls_ffi_bridge) and the browser client built from it (clients/web-mls) it is \
digest 0.10's buffer under sha2 0.10, hmac 0.12, curve25519-dalek 4 and the RustCrypto curves, \
whose block functions are the hashes' compression functions and never panic, so the bridge's \
catch_unwind around each FFI call never catches one mid-block. 0.12.1 fixes it but needs \
digest 0.11, which ed25519-dalek 2 and curve25519-dalek 4, pinned by openmls_rust_crypto and \
openmls_basic_credential 0.6.0, do not take. Bump when they do."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-04-30T00:00:00Z
reason = """crypto-bigint 0.5.5 can branch on secret values in operations meant to be \
constant-time. The OpenMLS bridge (infra/e2ee/mls_ffi_bridge) and the browser client built \
from it (clients/web-mls) reach it only through elliptic-curve 0.13, for the P-256, P-384 and \
secp256k1 curves openmls_rust_crypto and hpke-rs-rust-crypto compile in; both use only \
MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, whose secret keys are X25519 and Ed25519 \
(curve25519-dalek), so no secret ever goes through it. 0.7.6 fixes it but elliptic-curve 0.13 \
takes only 0.5. Bump when openmls_rust_crypto moves to elliptic-curve 0.14."""

# Trivy findings that do not fail the build (docs/adr/0072), for `trivy config`
# (tools/security/trivy-config.sh) and `trivy image` (tools/security/trivy-image.sh). Each entry
# is one check on the named files only, says why, and expires; past expired_at the finding
# fails its job again until someone looks at it afresh. tools/security/check-allowlists.py
# enforces all of that. Paths are as trivy-config.sh stages them, one resource per file:
# deploy/... as in the repository for a file with one resource, deploy/.../<file less
# .yaml>/<kind>-<namespace>-<name>.yaml for one with several, and
# rendered/<kustomization>/<kind>-<namespace>-<name>.yaml for the sandbox's renderings.
#
# A vulnerability entry (an image's package, `vulnerabilities:`) is scoped by the purls of the
# binary packages it waives, not by paths, and expires within 92 days (docs/adr/0072).

misconfigurations:
  # The worker's ffmpeg, and the live packager's, run in user, pid and mount namespaces of their
  # own and mount a /proc for their pid namespace (docs/adr/0025, 0032, 0046). The kubelet's
  # masked /proc paths would stop that mount; Unmasked only takes effect inside the pod's own
  # user namespace (hostUsers: false), so no host /proc path is exposed.
  - id: KSV-0027
    paths:
      - deploy/kubernetes/base/video-worker/deployment.yaml
      - rendered/deploy-kubernetes-overlays-staging/deployment-ulw-staging-video-worker.yaml
      - rendered/deploy-kubernetes-overlays-production/deployment-ulw-video-worker.yaml
      - rendered/deploy-local-cluster/deployment-ulw-video-worker.yaml
      - deploy/kubernetes/live-packager/job.yaml
    statement: >-
      The ffmpeg sandbox (worker and live packager) mounts /proc for its own pid namespace
      inside the pod's user namespace (hostUsers: false), which needs procMount Unmasked;
      ADR-0025, ADR-0032 and ADR-0046.
    expired_at: 2027-09-01

  # The STUNner gateway operator's RBAC, as its Helm chart ships it (operator.yaml's header).
  # Its ClusterRole reads Secrets in every namespace (get, list, watch: the TURN credentials a
  # GatewayConfig may name, wherever it lives) and creates, updates and deletes the stunnerd
  # Deployments and DaemonSets, Services and ConfigMaps it renders from Gateways. Its
  # leader-election Role manages ConfigMaps (and Leases) in stunner-system only. Each entry
  # names only the resources its check fires on, one file per resource (split-resources.py).
  # Narrowing the ClusterRole is STUNner's to do.
  - id: KSV-0041
    paths: &stunner-manager-role
      - deploy/kubernetes/cluster/stunner/operator/clusterrole-cluster-stunner-gateway-operator-manager-role.yaml
      - rendered/deploy-stunner/clusterrole-cluster-stunner-gateway-operator-manager-role.yaml
    statement: &stunner-manager-statement >-
      Upstream STUNner operator ClusterRole (stunner-helm v1.2.1): it reads Secrets cluster-wide
      (get, list, watch only) for TURN credentials, and manages the dataplane's Deployments,
      DaemonSets, Services and ConfigMaps.
    expired_at: 2027-09-01
  - id: KSV-0048
    paths: *stunner-manager-role
    statement: *stunner-manager-statement
    expired_at: 2027-09-01
  - id: KSV-0056
    paths: *stunner-manager-role
    statement: *stunner-manager-statement
    expired_at: 2027-09-01
  - id: KSV-0049
    paths:
      - deploy/kubernetes/cluster/stunner/operator/clusterrole-cluster-stunner-gateway-operator-manager-role.yaml
      - rendered/deploy-stunner/clusterrole-cluster-stunner-gateway-operator-manager-role.yaml
      - deploy/kubernetes/cluster/stunner/operator/role-stunner-system-stunner-gateway-operator-leader-election-role.yaml
      - rendered/deploy-stunner/role-stunner-system-stunner-gateway-operator-leader-election-role.yaml
    statement: >-
      Upstream STUNner operator RBAC (stunner-helm v1.2.1): the ClusterRole manages the
      dataplane's ConfigMaps in any namespace; the leader-election Role manages its lock
      ConfigMap in stunner-system.
    expired_at: 2027-09-01

  # The gateway's stream service creates each live stream's packager Job, and the Secret that
  # holds the stream's SRT passphrase, through the API server (docs/adr/0092): that is its whole
  # Role, in the packagers' own namespace only, with no get, list, update or delete of Secrets.
  # RBAC cannot narrow a create by resourceNames, as the name is not known when it is
  # authorized; the ValidatingAdmissionPolicy beside it (base/live-packager/admission-policy.yaml,
  # checked by deploy/local/check-live-admission.py) holds every Job it creates to the packager's
  # image and shape and every Secret to live-packager-<stream>, owned by that stream's Job.
  - id: KSV-0048
    paths: &live-packager-role
      - deploy/kubernetes/base/live-packager/rbac/role-ulw-live-video-gateway-live-packagers.yaml
      - rendered/deploy-kubernetes-overlays-staging/role-ulw-staging-live-video-gateway-live-packagers.yaml
      - rendered/deploy-kubernetes-overlays-production/role-ulw-live-video-gateway-live-packagers.yaml
      - rendered/deploy-local-cluster/role-ulw-live-video-gateway-live-packagers.yaml
    statement: &live-packager-role-statement >-
      The stream service's Role creates packager Jobs and their passphrase Secrets in the
      packagers' namespace only (ADR-0092); create cannot be narrowed by resourceNames, and the
      admission policy holds what it creates to a packager's shape and its own Secret.
    expired_at: 2027-09-01
  - id: KSV-0113
    paths: *live-packager-role
    statement: *live-packager-role-statement
    expired_at: 2027-09-01

  # Kubernetes runs the images and ignores HEALTHCHECK; the manifests' startup, readiness and
  # liveness probes are the health checks.
  - id: DS-0026
    paths:
      - deploy/docker/Dockerfile
      - deploy/local/mock-auth/Dockerfile
    statement: >-
      Kubernetes ignores HEALTHCHECK; the Deployments' probes (/api/v1/healthz, /api/v1/readyz,
      the worker's heartbeat file) are the health checks.
    expired_at: 2027-09-01

  # kube-router is the sandbox cluster's NetworkPolicy enforcer and nothing else: it programs
  # the kind node's iptables and ipsets from the host network, as root, with the xtables lock
  # mounted from the host, in kube-system, like any CNI's node daemon. It never ships; an
  # operator's cluster enforces policy with its own CNI (deploy/kubernetes/RUNBOOK.md, step 1).
  - id: KSV-0009
    paths: &kube-router [rendered/deploy-local-cluster/daemonset-kube-system-kube-router.yaml]
    statement: &kube-router-statement >-
      Sandbox-only NetworkPolicy enforcer: programs the kind node's iptables from the host
      network, which needs a root container with the host's xtables lock; it never ships.
    expired_at: 2027-09-01
  # It drops every capability and adds back the two netfilter needs, in place of privileged:
  # NET_ADMIN for iptables and ipset, and NET_RAW for iptables in legacy mode, which reads and
  # writes its tables through a raw socket. The image's iptables-wrapper picks legacy or nft by
  # the rules the node already has, so legacy has to keep working.
  - id: KSV-0022
    paths: *kube-router
    statement: &kube-router-caps >-
      Sandbox-only NetworkPolicy enforcer: NET_ADMIN programs iptables and ipsets, and NET_RAW
      is legacy iptables' raw socket to its tables; every other capability is dropped.
    expired_at: 2027-09-01
  - {id: KSV-0106, paths: *kube-router, statement: *kube-router-caps, expired_at: 2027-09-01}
  - {id: KSV-0119, paths: *kube-router, statement: *kube-router-caps, expired_at: 2027-09-01}
  - {id: KSV-0011, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0012, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0014, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0015, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0016, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0018, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0020, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0021, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0023, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0030, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0037, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}
  - {id: KSV-0104, paths: *kube-router, statement: *kube-router-statement, expired_at: 2027-09-01}

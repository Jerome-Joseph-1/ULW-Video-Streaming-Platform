name: soak-experiment

# One-off cleanup on the self-hosted runner: services left running by a cancelled soak.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Find and stop leftover services
        run: |
          echo "== before"
          ps -eo pid,user,etimes,args | awk 'NR==1 || /(chat_server|gateway_server|transcode_worker|soak\.py|chat_soak\.py)( |$)/' | grep -v awk || true
          sudo ss -ltnp | grep -E ':(18180|18190|19101|19111|19121|19201|19211|19221|55432|9000) ' || true
          for program in chat_server gateway_server transcode_worker; do
            sudo pkill -f "^[^ ]*/${program}( |\$)" || true
          done
          sleep 5
          for program in chat_server gateway_server transcode_worker; do
            sudo pkill -KILL -f "^[^ ]*/${program}( |\$)" || true
          done
          echo "== after"
          ps -eo pid,user,etimes,args | awk 'NR==1 || /(chat_server|gateway_server|transcode_worker)( |$)/' | grep -v awk || true
          sudo ss -ltnp | grep -E ':(18180|18190|19101|19111|19121) ' || echo "soak ports free"
          docker ps --format '{{.Names}} {{.Ports}}'

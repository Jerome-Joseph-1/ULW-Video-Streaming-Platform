name: soak-experiment

# A soak run dispatched by hand at any ref, for experiments on the soaks' memory and for the
# 6 h acceptance soak (ADR-0042, docs/operations/soak.md). The data is the point: samples.csv,
# the summary and the processes' logs are uploaded whatever the verdict.
#
# `runner` picks a GitHub-hosted runner or the project's self-hosted one. Hosted jobs are cut
# off at 6 h, build included, so there `hours` stops at 4.9, the most that leaves the job its
# 45 minutes for setup and the build under the 355 it is given; on the self-hosted runner it
# goes to 22, which keeps the job under the 24 h its token lives (the artifact upload at the end
# needs it) and the second job of `both`, queued behind the first, under the 24 h a queued job
# waits. It starts at 0.5: the judges skip the first 15 minutes and need ten samples after
# them.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run.
        type: choice
        options: [hosted, self-hosted]
        default: hosted
      kind:
        description: Which soak to run.
        type: choice
        options: [chat, gateway, both]
        default: chat
      hours:
        description: Hours of load, from 0.5 to 4.9 hosted or 22 self-hosted.
        type: number
        default: 1.5
      clients:
        description: Client threads, 1 to 1024; empty keeps the script's own (chat 64, gateway 8).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Checks the inputs and turns them into the soak job's matrix and timeouts, which expressions
  # alone cannot compute.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      job-minutes: ${{ steps.plan.outputs.job-minutes }}
      soak-minutes: ${{ steps.plan.outputs.soak-minutes }}
    steps:
      - id: plan
        # Through the environment, not spliced into the script: inputs are the dispatcher's text.
        env:
          RUNNER: ${{ inputs.runner }}
          KIND: ${{ inputs.kind }}
          HOURS: ${{ inputs.hours }}
          CLIENTS: ${{ inputs.clients }}
        run: |
          case $RUNNER in
            hosted) most=4.9 ;;
            self-hosted) most=22 ;;
            *) echo "::error::unknown runner '$RUNNER'"; exit 1 ;;
          esac
          if ! awk -v h="$HOURS" -v m="$most" 'BEGIN { exit !(h ~ /^[0-9]*\.?[0-9]+$/ && h >= 0.5 && h <= m) }'; then
            echo "::error::hours must be a number from 0.5 to $most on a $RUNNER runner, not '$HOURS'"
            exit 1
          fi
          # The chat server takes 1,280 connections; more clients would measure refusals.
          if [[ -n $CLIENTS && ! ( $CLIENTS =~ ^[1-9][0-9]{0,3}$ && $CLIENTS -le 1024 ) ]]; then
            echo "::error::clients must be empty or a whole number from 1 to 1024, not '$CLIENTS'"
            exit 1
          fi
          chat='{"kind":"chat","script":"tests/soak/chat_soak.py","out":"soak-chat","targets":"chat_server ulw_migrate ulw_devtoken"}'
          gateway='{"kind":"gateway","script":"tests/soak/soak.py","out":"soak-gw","targets":"gateway_server transcode_worker ulw_sandbox ulw_migrate ulw_devtoken"}'
          case $KIND in
            chat) include="[$chat]" ;;
            gateway) include="[$gateway]" ;;
            both) include="[$chat,$gateway]" ;;
            *) echo "::error::unknown kind '$KIND'"; exit 1 ;;
          esac
          # The soak itself: its hours, plus 15 minutes to start, stop its threads and judge.
          # The job: that plus 45 minutes for setup and the build; at most 4.9 hours keeps a
          # hosted job under 355, short of its 360.
          soak=$(awk -v h="$HOURS" 'BEGIN { m = h * 60; printf "%d", (m == int(m) ? m : int(m) + 1) + 15 }')
          job=$((soak + 45))
          {
            echo "matrix={\"include\":$include}"
            echo "soak-minutes=$soak"
            echo "job-minutes=$job"
          } >>"$GITHUB_OUTPUT"

  soak:
    name: soak (${{ matrix.kind }})
    needs: plan
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job-minutes) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # As ci.yml's integration job: the digest of deploy/local/compose.yaml, on the port and
    # password the soaks' default ULW_TEST_DATABASE_URL names. The chat soak needs Postgres
    # only; the gateway soak also starts MinIO below.
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        # Loopback only: a published port bypasses the host's firewall.
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
    steps:
      # A self-hosted runner keeps its workspace between jobs; the soak runs as root (below), so
      # anything an earlier one left there would stop the checkout from cleaning it.
      - if: inputs.runner == 'self-hosted'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What a hosted image carries and a bare Ubuntu 24.04 host does not. Ubuntu's rustup
      # (1.26) cannot install the toolchain rust-toolchain.toml names without being told it
      # again, so rustup 1.29.1 is fetched, pinned by digest.
      - name: Install what the hosted image has
        if: inputs.runner == 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake docker-compose-v2 build-essential
          if [[ ! -x ~/.cargo/bin/rustup ]]; then
            curl -sSfo "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
            echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --no-modify-path --default-toolchain none --profile minimal
            rm -f "$RUNNER_TEMP/rustup-init"
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      # The soaks create and drop their database with psql.
      - run: sudo apt-get install -y -qq --no-install-recommends postgresql-client
      # The gateway soak's store, on the address and keys its defaults name.
      - name: Start MinIO
        if: matrix.kind == 'gateway'
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      - run: cmake --preset ci
      - env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<<"$TARGETS"
          cmake --build --preset ci --target "${targets[@]}"
      - name: Soak
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.soak-minutes) }}
        env:
          SCRIPT: ${{ matrix.script }}
          OUT: ${{ runner.temp }}/${{ matrix.out }}
          HOURS: ${{ inputs.hours }}
          CLIENTS: ${{ inputs.clients }}
        run: |
          args=(--build build/ci --hours "$HOURS" --out "$OUT")
          if [[ -n $CLIENTS ]]; then
            args+=(--clients "$CLIENTS")
          fi
          # As root, as the soaks run on a host: the services make themselves undumpable
          # (ops::disable_core_dumps), which leaves their /proc/<pid>/fd, sampled every minute,
          # to root alone, and the scripts start them with ULW_ALLOW_ROOT for that reason. No
          # bytecode: root's __pycache__ would outlive the job on a self-hosted runner.
          sudo --preserve-env=ULW_TEST_DATABASE_URL PYTHONDONTWRITEBYTECODE=1 "$SCRIPT" "${args[@]}"
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          OUT: ${{ runner.temp }}/${{ matrix.out }}
        run: |
          if [[ -f $OUT/summary.txt ]]; then
            { echo '```'; cat "$OUT/summary.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi
      # The samples and logs whatever the verdict; not the copied binaries, the keys or the
      # gateway's scratch.
      - name: Upload the samples and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ matrix.out }}/samples.csv
            ${{ runner.temp }}/${{ matrix.out }}/summary.txt
            ${{ runner.temp }}/${{ matrix.out }}/pids.json
            ${{ runner.temp }}/${{ matrix.out }}/*.log
          if-no-files-found: warn
          retention-days: 30
      - if: failure() && matrix.kind == 'gateway'
        run: docker compose -f deploy/local/compose.yaml logs minio
      # A self-hosted runner keeps what a job leaves: services a cancelled soak did not stop
      # (root's, on fixed ports), the root-owned soak output, and MinIO.
      - if: always() && inputs.runner == 'self-hosted'
        env:
          OUT: ${{ runner.temp }}/${{ matrix.out }}
        run: |
          sudo pkill -x chat_server || true
          sudo pkill -x gateway_server || true
          sudo pkill -x transcode_worker || true
          sudo rm -rf "$OUT"
          docker compose -f deploy/local/compose.yaml down || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

name: soak-experiment

# Runner check: the self-hosted soak runner's identity, access and capacity.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Identity and access
        run: |
          set -x
          id; uname -a; . /etc/os-release; echo "$PRETTY_NAME"
          nproc; free -h; df -h / "$RUNNER_TEMP"; swapon --show
          sudo -n true && echo "sudo: ok"
          docker info --format 'docker {{.ServerVersion}}, live-restore {{.LiveRestoreEnabled}}'
          docker run --rm hello-world >/dev/null 2>&1 && echo "docker run: ok" || echo "docker run: FAILED"
          sudo ufw status | head -5
          for p in 55432 9000 18180 19101; do ss -ltn "sport = :$p" | tail -n +2 | grep -q . && echo "port $p: TAKEN" || echo "port $p: free"; done
          command -v gcc-14 clang-19 cmake ninja ccache psql python3 || true
      - name: Capacity
        run: |
          cpu() { awk '/^cpu /{print $2+$3+$4+$5+$6+$7+$8, $9}' /proc/stat; }
          steal_during() { read -r t0 s0 < <(cpu); "$@"; read -r t1 s1 < <(cpu)
            awk -v t=$((t1 - t0 + s1 - s0)) -v s=$((s1 - s0)) 'BEGIN{printf "%.1f%%", t ? 100*s/t : 0}'; }
          hash() { head -c "$1" /dev/zero | sha256sum >/dev/null; }
          secs() { local a b; a=$(date +%s.%N); "$@"; b=$(date +%s.%N); awk -v a=$a -v b=$b 'BEGIN{printf "%.2f", b-a}'; }
          N=$(nproc); echo "load: $(cut -d' ' -f1-3 /proc/loadavg)"
          echo "steal idle 30 s: $(steal_during sleep 30)"
          printf 'one core 1 GiB: '; for i in 1 2 3 4 5; do printf '%s ' "$(secs hash 1G)"; done; echo
          allc() { for _ in $(seq "$N"); do hash 8G & done; wait; }
          a=$(date +%s.%N); s=$(steal_during allc); b=$(date +%s.%N)
          awk -v a=$a -v b=$b -v n=$N 'BEGIN{printf "all %d cores 8 GiB each: %.2f s, ", n, b-a}'; echo "steal $s"
          python3 -c '
          import time
          d=[]; end=time.monotonic()+20
          while time.monotonic()<end:
              t=time.monotonic(); time.sleep(0.01); d.append((time.monotonic()-t-0.01)*1000)
          d.sort(); print(f"timer overshoot ms p50 {d[len(d)//2]:.2f} p99 {d[int(len(d)*0.99)]:.2f} max {d[-1]:.2f}")'
          D=$(mktemp -d "$RUNNER_TEMP/io.XXXX")
          echo "seq write: $(dd if=/dev/zero of="$D/f" bs=1M count=1024 conv=fdatasync 2>&1 | tail -1 | awk -F, '{print $NF}' | xargs)"
          echo "2000 synced 4K writes: $(secs dd if=/dev/zero of="$D/g" bs=4k count=2000 oflag=dsync status=none) s"
          rm -rf "$D"

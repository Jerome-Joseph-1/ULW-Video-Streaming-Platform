name: soak-experiment

# Gateway heap profile on the self-hosted runner: one gateway soak under jemalloc with heap
# profiling, a dump every GiB allocated, uploaded with the binary for jeprof.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of load per soak.
        type: number
        default: 2

permissions:
  contents: read

jobs:
  soaks:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
    steps:
      - run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake docker-compose-v2 build-essential \
            postgresql-client libmimalloc2.0=2.1.2+ds-2 libjemalloc2=5.3.0-2build1
      - run: |
          if [[ ! -x ~/.cargo/bin/rustup ]]; then
            curl -sSfo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
            echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --no-modify-path --default-toolchain none --profile minimal
            rm -f /tmp/rustup-init
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      # Five soaks share one Postgres: more connections than the image's default 100.
      - name: Start Postgres and MinIO
        run: |
          docker rm -f soak-pg >/dev/null 2>&1 || true
          docker run -d --name soak-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=testtest123 \
            postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54 \
            -c max_connections=600
          docker compose -f deploy/local/compose.yaml up -d --wait minio
          for _ in $(seq 60); do psql "$ULW_TEST_DATABASE_URL" -c 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          psql "$ULW_TEST_DATABASE_URL" -c 'show max_connections'
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target chat_server gateway_server transcode_worker ulw_sandbox ulw_migrate ulw_devtoken
      - name: Soaks
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          MI=$(dpkg -L libmimalloc2.0 | grep -E '/libmimalloc\.so\.[0-9.]+$' | head -1)
          JE=$(dpkg -L libjemalloc2 | grep -E '/libjemalloc\.so\.2$' | head -1)
          echo "mimalloc: $MI"; echo "jemalloc: $JE"; test -f "$MI"; test -f "$JE"
          O=$RUNNER_TEMP/soaks; mkdir -p "$O"
          mkdir -p "$O/prof"; sudo chmod 777 "$O/prof"
          run() {  # run NAME PRELOAD SCRIPT PORT
            sudo env ULW_TEST_DATABASE_URL="$ULW_TEST_DATABASE_URL" PYTHONDONTWRITEBYTECODE=1 \
              ULW_SOAK_MALLOC_CONF="prof:true,prof_prefix:$O/prof/gw,lg_prof_interval:30" \
              ULW_SOAK_PRELOAD="$2" "$3" --build build/ci --hours "$HOURS" --port "$4" --out "$O/$1" \
              >"$O/$1.console" 2>&1 && rc=0 || rc=$?
            echo "$rc" >"$O/$1.rc"
          }
          run gw-jeprof      "$JE" tests/soak/soak.py      18190 &
          # Proof the preloads took: the allocators mapped into the services.
          sleep 180
          for p in $(pgrep -x chat_server; pgrep -x gateway_server); do
            echo "$p $(tr '\0' ' ' </proc/$p/cmdline | cut -c1-40) $(sudo grep -oE 'lib(mi|je)malloc[^ ]*' /proc/$p/maps | sort -u | tr '\n' ' ')"
          done
          while pgrep -f 'tests/soak/(chat_soak|soak)\.py' >/dev/null; do
            echo "$(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg), mem avail $(awk '/MemAvailable/{printf "%.1f GB", $2/1048576}' /proc/meminfo)"
            sleep 600
          done
          wait
          for n in gw-jeprof; do
            echo "=================== $n: exit $(cat "$O/$n.rc")"
            sed -n '/^window:/,$p' "$O/$n/summary.txt" 2>/dev/null || tail -30 "$O/$n.console"
            { echo "### $n (exit $(cat "$O/$n.rc"))"; echo '```'; sed -n '/^window:/,$p' "$O/$n/summary.txt" 2>/dev/null || true; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          done
      - name: Upload the samples and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soaks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/soaks/*/samples.csv
            ${{ runner.temp }}/soaks/*/summary.txt
            ${{ runner.temp }}/soaks/*/*.log
            ${{ runner.temp }}/soaks/*.console
            ${{ runner.temp }}/soaks/prof/*.heap
            build/ci/apps/gateway/gateway_server
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: |
          sudo pkill -f '^[^ ]*python3? [^ ]*tests/soak/(chat_soak|soak)\.py' || true
          for program in chat_server gateway_server transcode_worker; do
            sudo pkill -f "^[^ ]*/${program}( |\$)" || true
          done
          sudo rm -rf "$RUNNER_TEMP/soaks"
          docker rm -f soak-pg || true
          docker compose -f deploy/local/compose.yaml down || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

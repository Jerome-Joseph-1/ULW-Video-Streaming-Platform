name: security

# Static and supply-chain checks (docs/adr/0072), each job in parallel and none waiting on
# ci.yml: CodeQL over the C++ build, osv-scanner over every lock file and the vendored C and
# C++, Trivy over deploy/, and actionlint and zizmor over .github/. The binary hardening check
# runs where the binaries are built (ci.yml's build-test; e2e.yml's sandbox for the release
# images, with Trivy's image scan). Weekly as well, since new advisories arrive without a push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

# Each job asks for what it needs; only CodeQL's upload writes anything.
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # security-extended over the ci preset's servers, libraries and tools, as GCC compiles them.
  # The tests are left out: they double the build, and what they would find is in no binary
  # that ships. ccache is off because CodeQL reads each compiler invocation, and a cache hit
  # skips it.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # The SARIF upload to code scanning.
      security-events: write
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: codeql
          ccache: "false"
      # CodeQL extracts every compiler invocation that runs after init, and paths-ignore does
      # not filter a traced C++ build. So the steps it should not see run first: the configure,
      # whose try_compile probes are compiler runs too, and the FetchContent dependencies
      # (llhttp, srt), which are upstream's code and whose advisories the dependencies job
      # tracks. The traced build then compiles every first-party translation unit and nothing
      # else; the project's sources still read the dependencies' headers as they include them.
      - run: cmake --preset ci -DULW_BUILD_TESTS=OFF
      - run: cmake --build --preset ci --target llhttp_static srt_static
      # The action's release pins the CodeQL bundle (codeql-bundle-v2.27.1, its defaults.json);
      # moving the SHA below is what moves the bundle.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      - run: cmake --build --preset ci
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp

  # Every lock file (Cargo, npm, hash-pinned pip) and the C and C++ tarballs of
  # cmake/Dependencies.cmake against OSV. Allowlist: tools/security/osv-scanner.toml.
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/security/osv-scan.sh

  # Trivy's misconfiguration checks over deploy/: the manifests and Dockerfiles, and the
  # sandbox's kustomizations as rendered. Allowlist: tools/security/trivyignore.yaml.
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y -qq --no-install-recommends python3-yaml
      - run: tools/security/trivy-config.sh
      # The allowlist, image-pin, image-report and live-admission scripts' own tests.
      - run: python3 tools/security/security_tools_test.py

  # actionlint, with the run steps through shellcheck, and zizmor (.github/zizmor.yml).
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's, exact, rather than whichever the runner image carries.
      - run: sudo apt-get install -y -qq --no-install-recommends shellcheck=0.9.0-1
      # The job's token, for zizmor's online audits of the pinned actions (they read public
      # repositories only; contents: read is all it holds). The script hands it to zizmor alone.
      - run: tools/security/lint-workflows.sh
        env:
          GH_TOKEN: ${{ github.token }}

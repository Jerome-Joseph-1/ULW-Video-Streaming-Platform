name: restart-runner

# Restarts one of the self-hosted runner services on the project's host, for when a runner must
# pick up a change to its environment (its .path, for one: docs/operations/soak.md). Dispatched
# by hand; only writers can dispatch, and every run stays in the Actions history.
#
# The job runs on whichever self-hosted runner takes it, which may be the one it restarts, so the
# restart is handed to systemd for 15 s later: the job has ended by then and its own runner, if
# it is the target, comes back idle. A runner in the middle of another job (a 6 h soak, say) is
# refused unless `force` is set, because a restart cancels that job.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Which runner to restart (1 is the first one installed, 2-4 its copies).
        type: choice
        options: ["1", "2", "3", "4"]
      force:
        description: Restart even if that runner is running another job (the job is cancelled).
        type: boolean
        default: false

permissions: {}

concurrency:
  group: restart-runner
  cancel-in-progress: false

jobs:
  restart:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Schedule the restart
        env:
          TARGET: ${{ inputs.runner }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          units=$(systemctl list-units --type=service --all --no-legend 'actions.runner.*' |
              awk '{print $1}')
          case "$TARGET" in
            1) unit=$(grep -vE -- '-[234]\.service$' <<<"$units" || true) ;;
            2 | 3 | 4) unit=$(grep -E -- "-${TARGET}\.service\$" <<<"$units" || true) ;;
            *) echo "::error::no runner $TARGET"; exit 1 ;;
          esac
          if [[ $(wc -l <<<"$unit") -ne 1 || -z $unit ]]; then
            echo "::error::expected one service for runner $TARGET, found: ${unit:-none}"
            exit 1
          fi
          dir=$(realpath -m "$(systemctl show -p WorkingDirectory --value "$unit")")
          self=$(realpath -m "$RUNNER_WORKSPACE/../..")
          # A runner busy with a job has a Runner.Worker; this job's own counts only when the
          # target is this runner, and then the restart waits for the job to end.
          if [[ $dir != "$self" ]] && pgrep -f "^$dir/bin/Runner.Worker( |\$)" >/dev/null; then
            if [[ $FORCE != true ]]; then
              echo "::error::runner $TARGET ($unit) is running a job; dispatch with force to cancel it"
              exit 1
            fi
            echo "::warning::runner $TARGET is running a job, which the restart cancels"
          fi
          sudo systemd-run --quiet --on-active=15 --unit="restart-runner-$TARGET-$GITHUB_RUN_ID" \
              /usr/bin/systemctl restart "$unit"
          echo "runner $TARGET ($unit, $dir) restarts in 15 s"

name: e2e

# The sandbox cluster end to end: bring it up, run the VOD and chat checks, the STUNner checks
# and the resource check under load, take it down. A manual run, the nightly one and a phase
# tag's are the same job with the same steps. Everything happens inside this runner's kind
# cluster; the workflow has no credentials and reaches no operator's infrastructure.
#
# Beside it, two jobs run on a build tree, with no cluster, each starting its own services from
# it and serving its own page, so neither can be pointed at the sandbox route. browser runs the
# hls.js playback spec and the SDP round-trip spec (tests/e2e/run.sh); vod_flow's playback
# scenario covers the same route in the sandbox job. live-playback runs M31's live check
# (tests/e2e/live-run.sh) and records its measured glass-to-glass latency in the run's summary.
# A manual run with sandbox=false skips the cluster job.
on:
  workflow_dispatch:
    inputs:
      sandbox:
        description: Also run the sandbox cluster job (false runs the build-tree jobs alone)
        type: boolean
        default: true
  schedule:
    - cron: "43 3 * * *"
  push:
    tags: ["phase-*"]

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  sandbox:
    if: github.event_name != 'workflow_dispatch' || inputs.sandbox
    runs-on: ubuntu-24.04
    # Cold image builds dominate; the rest is minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the sandbox scripts and checks call on the runner: ffmpeg for the test clips and
      # PyYAML for vod_flow's kubeconfig guard. Docker, kind's prerequisites, curl and openssl
      # ship with the image; the images build inside Docker.
      - name: Install the checks' dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-yaml
      # The worker runs ffmpeg in user, network, mount and pid namespaces of its own (ADR-0025)
      # and refuses to start without them. Ubuntu 24.04's AppArmor lets a process without host
      # capabilities, as the worker is, create a user namespace but not use it. The probe is
      # the worker's sandbox in miniature; its first result goes to the log, the second must
      # pass. The sandbox runner only: deploy/kubernetes/RUNBOOK.md step 1 covers an operator's
      # nodes.
      - name: Allow the worker sandbox's user namespaces
        run: |
          probe() {
            unshare --user --map-root-user --net --mount --pid --fork --mount-proc true
          }
          probe && echo "restricted: namespaces usable" || echo "restricted: namespaces refused"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          probe
      # stunner_check.py's client on the outside network (198.18.0.0/24, sandbox.sh) must reach
      # 198.18.0.1:3478 through Docker's DNAT and keep its source address. Docker before 29,
      # which this image ships, does neither by default: while the userland proxy is on, its nat
      # rules skip DNAT for packets arriving from any Docker bridge, so docker-proxy takes them
      # and forwards them from the kind network's gateway address; with the proxy off, its bridge
      # isolation drops the DNATed packet on the way into the kind network. The proxy off and
      # DNATed packets from the outside network accepted in DOCKER-USER, the chain Docker leaves
      # to the host, give the path Docker 29 has out of the box; replies pass Docker's own
      # conntrack rule.
      - name: Let the outside network reach the published ports through DNAT
        run: |
          version=$(docker version --format '{{.Server.Version}}')
          echo "docker $version"
          if (( ${version%%.*} >= 29 )); then exit 0; fi
          config=/etc/docker/daemon.json
          { sudo cat "$config" 2>/dev/null || echo '{}'; } \
            | jq '. + {"userland-proxy": false}' | sudo tee "$config.new"
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          sudo iptables -I DOCKER-USER -s 198.18.0.0/24 -m conntrack --ctstate DNAT -j ACCEPT
      - run: make e2e-up
        id: up
        timeout-minutes: 45
      # kubeconform, then kubectl apply --dry-run=server of deploy/kubernetes's example overlays
      # and STUNner's manifests against this cluster's API server and installed CRDs.
      - run: make validate-manifests
        timeout-minutes: 5
      - run: make e2e-test
        timeout-minutes: 20
      # STUNner and LiveKit are already up (e2e-up); this checks them from the outside network.
      - run: make e2e-stunner
        timeout-minutes: 10
      - run: make e2e-load
        timeout-minutes: 15
      # The release build's binaries, as the images carry them (docs/adr/0072).
      - name: Release binaries hardened
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        # Outside the checkout, so nothing copied out of an image lands in the workspace.
        run: |
          for image in ulw/video-gateway:e2e ulw/video-worker:e2e ulw/chat:e2e \
              ulw/live-packager:e2e; do
            dir=$RUNNER_TEMP/release-bin/${image//[:\/]/-}
            mkdir -p "$dir"
            container=$(docker create "$image")
            docker cp "$container:/usr/local/bin/." "$dir"
            docker rm "$container" >/dev/null
          done
          tools/check-hardening.sh "$RUNNER_TEMP"/release-bin/*/*
      # The four images an operator runs, for OS and library vulnerabilities. Every HIGH or
      # CRITICAL, by Trivy's rating or NVD's, fixed or not, goes into the job summary and the JSON
      # report below; HIGH and CRITICAL by Trivy's rating with a fix available fail
      # (tools/security/trivy-image.sh). mock-auth is the sandbox's own.
      - name: Image vulnerabilities
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        env:
          TRIVY_REPORT_DIR: ${{ runner.temp }}/trivy-image
        run: >-
          tools/security/trivy-image.sh ulw/video-gateway:e2e ulw/video-worker:e2e ulw/chat:e2e
          ulw/live-packager:e2e
      - if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image
          path: ${{ runner.temp }}/trivy-image
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-report
          path: load-report
          if-no-files-found: warn
      # Pods, events, unready pods' descriptions and logs, and the host's user namespace and
      # AppArmor settings; the script also prints the telling lines into this log.
      - name: Collect the sandbox's state
        if: failure()
        run: deploy/local/diagnose.sh diagnostics
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics
          path: diagnostics
          if-no-files-found: warn
      - if: always()
        run: make e2e-down

  # The M11 and M24 acceptance in Chrome for Testing: hls.js plays the worker's output through
  # the gateway, switches rendition on demand without a stall and reads segments from the store's
  # host; Chrome's offers go through codec/sdp and back byte for byte. run.sh starts its own
  # gateway_server and transcode_worker on a scratch database and bucket.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-14-ci-browser
      # run.sh needs Node 20 or later and nothing in tests/e2e pins one, so this is the current
      # LTS, exact, rather than whatever the runner image ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          # Nothing here is installed through npm's cache, and a cache a pull request could
          # write is one a later run would restore.
          package-manager-cache: false
      # stack.mjs creates and drops its scratch database with psql.
      - run: sudo apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      - run: cmake --preset ci
      - run: >-
          cmake --build --preset ci
          --target gateway_server transcode_worker ulw_migrate ulw_devtoken
          ulw_sdp_roundtrip
      - run: tests/e2e/run.sh build/ci
        timeout-minutes: 30
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml logs minio

  # hls.js in Chrome for Testing plays a stream the test publisher sends live_packager over SRT,
  # its playlist through the gateway's live route and LiveManifestCache, its segments from
  # MinIO on the URLs the gateway signed; the media sequence only grows; the stream's end
  # reaches the player as EXT-X-ENDLIST and playback ends cleanly (tests/e2e/live.e2e.mjs).
  live-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
      ULW_LIVE_LATENCY_FILE: ${{ github.workspace }}/live-report/live-latency.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain, ffmpeg (with SRT, for the test publisher) and the user namespaces the
      # packager's sandboxed ffmpeg needs.
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-14-ci-live-e2e
      # live-run.sh needs Node 20 or later: the same exact release as the browser job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          # Nothing here is installed through npm's cache, and a cache a pull request could
          # write is one a later run would restore.
          package-manager-cache: false
      # stack.mjs creates and drops its scratch database with psql.
      - run: sudo apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target gateway_server live_packager ulw_devtoken ulw_migrate
      - run: mkdir -p live-report
      - run: tests/e2e/live-run.sh build/ci
        timeout-minutes: 15
      - name: Record the measured latency
        if: always()
        run: |
          report=live-report/live-latency.json
          if [[ -f $report ]]; then
            {
              echo "### Live playback: glass-to-glass latency"
              echo
              jq -r '"Median \(.glassToGlassMs.median) ms, p95 \(.glassToGlassMs.p95) ms (picture clock, \(.samples) samples); program date time median \(.programDateTimeMs.median) ms; target duration \(.segmentSeconds) s; \(.stalls) stalls; gateway: \(.gateway.livePlaylistRequests) playlist requests, \(.gateway.storeReads) store reads."' "$report"
              echo
              echo '```json'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$report"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-latency
          path: live-report
          if-no-files-found: warn
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml logs minio

  # Live publishing as a client does it (docs/adr/0092, tests/e2e/live-publish.e2e.mjs): a
  # broadcaster's page starts a stream through the gateway, publishes Chromium's fake camera
  # over WHIP with the ticket the gateway issued, goes live; the gateway starts the packager
  # and LiveKit's recorder relays to it; a second user watches in hls.js; the broadcaster ends
  # it, and its recording becomes a video the worker makes ready. A second run never calls start
  # or end: LiveKit's webhooks to the gateway take the stream live and, once the page drops its
  # connection, end it (docs/adr/0093).
  live-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-14-ci-live-publish
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: sudo apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Start MinIO, LiveKit and its recorder
        run: docker compose -f deploy/local/compose.yaml --profile calls up -d --wait minio livekit egress
      - run: cmake --preset ci
      - run: >-
          cmake --build --preset ci --target gateway_server transcode_worker live_packager
          ulw_sandbox ulw_devtoken ulw_migrate
      - run: tests/e2e/live-publish-run.sh build/ci
        timeout-minutes: 20
        env:
          LIVEKIT_API_URL: http://127.0.0.1:7880
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml --profile calls logs livekit egress minio

  # Brief section 14's call capacity: the pinned LiveKit carrying 1:1 calls from SDK clients on
  # this runner, its egress per call and CPU per call against the derivation (brief 8.1,
  # ADR-0012). Independent of the sandbox cluster; the SFU runs in a container of its own.
  call-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the SDK the clients use
        run: |
          python3 -m venv "$RUNNER_TEMP/callcap"
          "$RUNNER_TEMP/callcap/bin/pip" install -q --require-hashes --only-binary :all: \
            -r tests/load/call_capacity/requirements.txt
      # Root reads the SFU container's interface counters from /proc/<pid>/net/dev.
      - run: >-
          sudo "$RUNNER_TEMP/callcap/bin/python" tests/load/call_capacity/call_capacity.py
          --calls 4 --seconds 60 --out call-capacity
        timeout-minutes: 10
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: call-capacity
          path: call-capacity
          if-no-files-found: warn

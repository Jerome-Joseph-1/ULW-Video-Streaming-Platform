name: e2e

# The sandbox cluster end to end: bring it up, run the VOD checks, the STUNner checks and the
# resource check under load, take it down. A manual run, the nightly one and a phase tag's are
# the same job with the same steps. Everything happens inside this runner's kind cluster; the
# workflow has no credentials and reaches nothing of Askedin's.
#
# The hls.js playback spec (tests/e2e) is not part of it: it starts its own gateway and worker
# from a build tree and serves its own page, so it cannot be pointed at the sandbox route, and
# ci.yml does not run it either. vod_flow's playback scenario covers the same route here.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
  push:
    tags: ["phase-*"]

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    # Cold image builds dominate; the rest is minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What the sandbox scripts and checks call on the runner: ffmpeg for the test clips and
      # PyYAML for vod_flow's kubeconfig guard. Docker, kind's prerequisites, curl and openssl
      # ship with the image; the images build inside Docker.
      - name: Install the checks' dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-yaml
      # The worker runs ffmpeg in user, network, mount and pid namespaces of its own (ADR-0025)
      # and refuses to start without them. Ubuntu 24.04's AppArmor lets a process without host
      # capabilities, as the worker is, create a user namespace but not use it. The probe is
      # the worker's sandbox in miniature; its first result goes to the log, the second must
      # pass. The sandbox runner only: RUNBOOK.md step 1 covers Askedin's nodes.
      - name: Allow the worker sandbox's user namespaces
        run: |
          probe() {
            unshare --user --map-root-user --net --mount --pid --fork --mount-proc true
          }
          probe && echo "restricted: namespaces usable" || echo "restricted: namespaces refused"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          probe
      - run: make e2e-up
        timeout-minutes: 45
      - run: make e2e-test
        timeout-minutes: 20
      # STUNner and LiveKit are already up (e2e-up); this checks them from the outside network.
      - run: make e2e-stunner
        timeout-minutes: 10
      - run: make e2e-load
        timeout-minutes: 15
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-report
          path: load-report
          if-no-files-found: warn
      # Pods, events, unready pods' descriptions and logs, and the host's user namespace and
      # AppArmor settings; the script also prints the telling lines into this log.
      - name: Collect the sandbox's state
        if: failure()
        run: deploy/local/diagnose.sh diagnostics
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics
          path: diagnostics
          if-no-files-found: warn
      - if: always()
        run: make e2e-down

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }}/${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc-14, cxx: g++-14, preset: ci, test: ci }
          - { compiler: clang, cc: clang-19, cxx: clang++-19, preset: ci, test: ci }
          - { compiler: clang, cc: clang-19, cxx: clang++-19, preset: asan, test: unit }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.compiler }}-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.test }}
      - run: ccache --show-stats

  tsan:
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-tsan
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan-unit

  reactor-matrix:
    name: reactor-matrix (${{ matrix.reactor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        reactor: [io_uring, epoll]
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_REACTOR: ${{ matrix.reactor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      - name: io_uring probe
        run: |
          gcc -O2 tools/io_uring_probe.c -o io_uring_probe -luring
          ./io_uring_probe
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      # gtest_discover_tests appends "  # GetParam() = ..." to parameterised test names.
      - run: ctest --preset ci -R 'Reactors/.*/${{ matrix.reactor == 'io_uring' && 'IoUring' || 'Epoll' }}( |$)'
      # The gateway harness takes its reactor from ULW_REACTOR, which build-test leaves unset.
      - run: ctest --preset ci -R '^(Transports/GatewayUpload|GatewayTls)\.'
      - name: echo acceptance
        run: tests/load/echo_acceptance.sh build/ci ${{ matrix.reactor }} 20

  # The storage laws, the wire behaviour the S3 adapter relies on, the store's reaper, and the
  # catalog and job queue, against real servers. Nothing here passes -j, and nothing may: the
  # pool test docker-pauses the Postgres every other catalog and queue test is using, and the
  # reaper test aborts every upload in the shared bucket older than its cutoff, conformance
  # runs included, which is also why those come after the integration label, not beside it.
  integration:
    name: integration (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: ci, cc: gcc-14, cxx: g++-14 }
          - { preset: asan, cc: clang-19, cxx: clang++-19 }
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.cc }}-${{ matrix.preset }}-integration
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      - run: cmake --preset ${{ matrix.preset }} -DULW_CONFORMANCE_LIVE=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} -L integration --output-on-failure
        env:
          # The job context exists only in steps, not in the job's own env.
          ULW_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: storage conformance on both reactors
        run: |
          ULW_REACTOR=io_uring ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
          ULW_REACTOR=epoll ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml logs minio

  # The M16 and M17 acceptance: three chat_server processes on ports 9101-9103 over one
  # Postgres. Their room's owner stopped until a survivor takes over, then resumed to be fenced
  # out; clients on every node seeing one order, rate limits, retries, resume, and no body in any
  # log or table. The tests are parameterised over both reactors, so one run covers io_uring and
  # epoll.
  cluster:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
      ULW_CHAT_CLUSTER_PORTS: 9101,9102,9103
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target chat_server chat_cluster_tests
      - run: ctest --test-dir build/ci -R '^Reactors/ChatClusterTest\.' --output-on-failure

  # M30's acceptance (tests/call/ingest.spec.mjs, ADR-0056): WHIP publishers, GStreamer's
  # whipsink among them, against the LiveKit, Redis and egress of deploy/local/compose.yaml, and a
  # relayed stream through to the live packager's playlist.
  ingest:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      # gst-launch and the plugins the publisher's pipeline uses, and the development files
      # whipsink builds against (fetch-whipsink.sh).
      - name: Install GStreamer
        run: |
          sudo apt-get install -y -qq --no-install-recommends gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-nice libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
      # A build is only good for the GStreamer it linked against and the compiler that made it;
      # fetch-whipsink.sh rebuilds whatever the key lets through that does not match either.
      - name: GStreamer version
        id: gstreamer
        run: echo "version=$(pkg-config --modversion gstreamer-webrtc-1.0)" >>"$GITHUB_OUTPUT"
      - name: Restore the whipsink build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/call/.whipsink
          key: whipsink-gst${{ steps.gstreamer.outputs.version }}-${{ hashFiles('tests/call/whipsink/*', 'tests/call/fetch-whipsink.sh') }}
      - run: tests/call/fetch-whipsink.sh
      - name: Start LiveKit, Redis and egress
        run: docker compose -f deploy/local/compose.yaml --profile calls up -d --wait livekit egress
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target ulw_call_harness live_packager ulw_sandbox
      - run: tests/call/run.sh build/ci ingest.spec.mjs
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml --profile calls logs livekit egress

  lint:
    name: boundaries + format + tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-lint
      - run: tools/check-boundaries.sh
      - run: tools/check-format.sh
      - run: cmake --preset ci
      # Generated headers must exist before clang-tidy can parse the sources.
      - run: cmake --build --preset ci --target ulw_build_info
      # The bridge's own checks, the generated C header's drift check among them.
      - name: OpenMLS bridge (rustfmt, clippy, cargo test)
        working-directory: infra/e2ee/mls_ffi_bridge
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo test --locked --offline
      - name: clang-tidy (changed files)
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD")
          tools/run-clang-tidy.sh build/ci "${changed[@]}"
      - name: clang-tidy (full tree)
        if: github.event_name != 'pull_request'
        run: tools/run-clang-tidy.sh build/ci
      # Last, and run even when a step above failed, so a branch whose decision number waits on
      # another branch still gets its format and clang-tidy results.
      - name: docs (decision numbering, routes documented)
        if: ${{ !cancelled() }}
        run: python3 tools/check-docs.py

  # The WebSocket codec against the Autobahn fuzzingclient, through the echo server on each
  # reactor. run.sh pins the image by digest and fails on any verdict outside its allowlist.
  autobahn:
    name: autobahn (${{ matrix.reactor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        reactor: [io_uring, epoll]
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_REACTOR: ${{ matrix.reactor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target ulw_ws_echo_server
      - run: tests/autobahn/run.sh build/ci
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autobahn-reports-${{ matrix.reactor }}
          path: build/ci/autobahn

  # Five minutes per target on pull requests that touch a parser or codec, and on pushes to
  # main; thirty on the nightly and manual runs. Other pull requests skip the build: the unit
  # label already replays the committed corpora on every build.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [ws, http, hls, toml, mls, sdp, rtp]
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Choose the run length
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case $EVENT in
            schedule | workflow_dispatch) seconds=1800 ;;
            push) seconds=300 ;;
            *)
              if git diff --quiet "origin/$BASE_REF...HEAD" -- http codec ops tests/fuzz \
                  core/src/hls.cpp core/include/core/util/hls.hpp infra/e2ee; then
                seconds=0
              else
                seconds=300
              fi
              ;;
          esac
          echo "seconds=$seconds" >>"$GITHUB_OUTPUT"
      - if: steps.scope.outputs.seconds != '0'
        uses: ./.github/actions/setup
        with:
          cache-key: clang-fuzz
      - if: steps.scope.outputs.seconds != '0'
        run: cmake --preset fuzz
      - if: steps.scope.outputs.seconds != '0'
        run: cmake --build --preset fuzz --target ${{ matrix.target }}_fuzz
      # A scratch corpus, so what the run discovers never lands in the checkout.
      - if: steps.scope.outputs.seconds != '0'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_RUN: ${{ steps.scope.outputs.seconds }}
        run: |
          mkdir -p fuzz-work/corpus fuzz-work/artifacts
          cp "tests/fuzz/corpus/$TARGET"/* fuzz-work/corpus/
          "build/fuzz/tests/${TARGET}_fuzz" -max_total_time="$SECONDS_TO_RUN" \
            -print_final_stats=1 -artifact_prefix=fuzz-work/artifacts/ fuzz-work/corpus
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz-work/artifacts

  # Every commit, not just the tip: a secret that was committed and then removed is still one.
  # Allowlist entries are in .gitleaks.toml, each scoped to a rule and a file.
  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release, linux_x64 line.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  # Offline: every manifest against pinned schemas (deploy/local/tools.sh). The server-side
  # dry run against the sandbox cluster is a step of e2e.yml, where a cluster exists.
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y -qq --no-install-recommends python3-yaml
      - run: deploy/local/validate-manifests.sh

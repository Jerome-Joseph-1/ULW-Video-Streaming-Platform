name: ci

# Two lanes (docs/operations/ci-lanes.md). A pull request runs the quick lane: the `changes` job,
# one build with the unit label (gcc/ci), lint as one job over the changed files, coverage and the
# SonarQube scan, secrets, manifests when deploy/ changed, and the browser MLS client's checks
# (web-mls-dist, and its step of lint) when clients/web-mls/ changed; a pull request that touches
# only docs/, Markdown, deploy/ or .github/ skips the build and coverage. A push to main or to a
# batch/** branch, the nightly run and a manual run run the full suite: every job below. The merge
# loop pushes batch/N (main plus the queued pull requests' heads) and squash-merges them only once
# that run is green, so every check runs on the tree main ends up with.
on:
  push:
    branches: [main, "batch/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

# Where each job runs (docs/operations/ci-lanes.md, "Where jobs run"): the jobs that need the
# self-hosted host's kernel (io_uring, locked memory: build-test, tsan, reactor-matrix,
# autobahn, fuzz) run there for pushes, the nightly, manual runs and pull requests from branches
# of this repository; a hosted runner takes them for pull requests from forks, whose code must
# never run on that host. Main's runs (its pushes and the nightly) may take any of the host's
# runners; every other run takes only those labelled as the repository variable
# ULW_SHARED_RUNNERS says, a JSON list such as ["self-hosted","ulw-shared"], so a runner left
# without that label is main's alone and main never queues behind pull requests. Unset, every
# run may take any runner. Lint, secrets and manifests need nothing the host has and run hosted
# whatever the event: the repository is public, so hosted minutes cost nothing. The host's
# runners take up to four jobs at once and keep their state between jobs, so jobs that publish a
# fixed host port, start deploy/local/compose.yaml's fixed-name containers, or change the host
# beyond the setup action's sysctls stay on ubuntu-24.04 whatever the event (each says which).
jobs:
  # Which lane this run is, and on a pull request what it changed (docs/operations/ci-lanes.md).
  # Outside a pull request every output is the full lane's. On a pull request, `code` is false when
  # every changed path (both sides of a rename) is under docs/, deploy/ or .github/ or ends in .md,
  # `deploy` is whether any is under deploy/, and `web-mls` whether any is under clients/web-mls/.
  # The diff is against the merge base, as lint's clang-tidy step takes it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.lane.outputs.full }}
      code: ${{ steps.lane.outputs.code }}
      deploy: ${{ steps.lane.outputs.deploy }}
      web-mls: ${{ steps.lane.outputs.web-mls }}
      build-test: ${{ steps.lane.outputs.build-test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the lane
        id: lane
        # Through the environment, not spliced into the script: a branch name is the pull
        # request author's text.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          entry() {
            printf '{"compiler":"%s","cc":"%s","cxx":"%s","preset":"%s","test":"%s","label":"%s"}' "$@"
          }
          gcc_ci=$(entry gcc gcc-14 g++-14 ci ci "")
          gcc_unit=$(entry gcc gcc-14 g++-14 ci ci unit)
          clang_ci=$(entry clang clang-19 clang++-19 ci ci "")
          clang_asan=$(entry clang clang-19 clang++-19 asan unit "")
          if [[ $EVENT != pull_request ]]; then
            {
              echo "full=true"
              echo "code=true"
              echo "deploy=true"
              echo "web-mls=true"
              echo "build-test=[$gcc_ci,$clang_ci,$clang_asan]"
            } >>"$GITHUB_OUTPUT"
            echo "full lane ($EVENT)"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD")
          code=false
          deploy=false
          web_mls=false
          while IFS= read -r path; do
            [[ -n $path ]] || continue
            case $path in
              deploy/*) deploy=true ;;
              clients/web-mls/*) code=true web_mls=true ;;
              docs/* | .github/* | *.md) ;;
              *) code=true ;;
            esac
          done <<<"$changed"
          {
            echo "full=false"
            echo "code=$code"
            echo "deploy=$deploy"
            echo "web-mls=$web_mls"
            echo "build-test=[$gcc_unit]"
          } >>"$GITHUB_OUTPUT"
          echo "quick lane: code=$code deploy=$deploy web-mls=$web_mls, $(grep -c . <<<"$changed") paths changed"

  # The full lane: gcc and clang with every test, and clang's ASan/UBSan build with the unit
  # label. The quick lane: gcc with the unit label, on pull requests that change code.
  build-test:
    name: build-test (${{ matrix.compiler }}/${{ matrix.preset }}${{ matrix.label && format(', {0}', matrix.label) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: &trusted-runner ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || (github.ref == 'refs/heads/main' && 'self-hosted' || fromJSON(vars.ULW_SHARED_RUNNERS || '"self-hosted"')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build-test) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PRESET: ${{ matrix.preset }}
      TEST_PRESET: ${{ matrix.test }}
      TEST_LABEL: ${{ matrix.label }}
    steps:
      # First in every job that may run on the self-hosted host, before the checkout (which a
      # local action would need), so defined once here and repeated by its YAML alias. A
      # self-hosted runner keeps its workspace between jobs, and an earlier job may have left
      # root's files there (build-test's root step, autobahn's container) or, if cancelled,
      # root's processes running; either would stop the checkout from cleaning it. Processes
      # are matched by their executable's real path in this runner's own workspace and scratch,
      # so the host's other runners' jobs are left alone.
      - &clear-runner
        name: Clear what an earlier job on this runner left
        if: runner.environment == 'self-hosted'
        run: |
          workspace=$(realpath -m "$GITHUB_WORKSPACE")
          temp=$(realpath -m "$RUNNER_TEMP")
          for dir in "$workspace" "$temp"; do
            sudo find /proc -mindepth 2 -maxdepth 2 -name exe -lname "$dir/*" \
              -printf '%h\n' 2>/dev/null | cut -d/ -f3 | xargs -r sudo kill -KILL || true
          done
          sudo chown -R "$(id -u):$(id -g)" "$workspace" "$temp"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.compiler }}-${{ matrix.preset }}
      - run: cmake --preset "$PRESET"
      - run: cmake --build --preset "$PRESET"
        id: build
      # Every io_uring ring is charged to the user's RLIMIT_MEMLOCK, summed over all of that user's
      # processes (the integration job says why), and the self-hosted runners share one user, so
      # the limit is lifted for the tests as the integration job does.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --preset "$TEST_PRESET" ${TEST_LABEL:+-L "$TEST_LABEL"}
      # PIE, full RELRO, NX, no RWX segment, stack protector, IBT and SHSTK on every server and
      # tool, and the hardening flags on every unit that goes into them (docs/adr/0072). Runs
      # whenever the build did, whatever the tests did, so each failure shows on its own. Not
      # on the sanitizer build, which ships nowhere and which the script refuses.
      - name: binary hardening
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'ci' }}
        run: tools/check-hardening.sh build/ci
      # The runner is not root, so the step above skips these; only root can change to another
      # user's ids, and the drop's order and checks are only proven by doing it. The gateway's
      # own run covers both reactors, since it binds its listener before the drop.
      - name: privilege drop, as root
        run: |
          sudo -E ctest --test-dir "build/$PRESET" -R '^(DropPrivilegesTest|LeaveRootTest)\.' --no-tests=error --output-on-failure
          for reactor in io_uring epoll; do
            sudo -E env ULW_REACTOR=$reactor ctest --test-dir "build/$PRESET" -R '^GatewayAsRoot\.' --no-tests=error --output-on-failure
          done
      - run: ccache --show-stats

  tsan:
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: *trusted-runner
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-tsan
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      # Every io_uring ring is charged to the user's RLIMIT_MEMLOCK, summed over all of that user's
      # processes (the integration job says why), and the self-hosted runners share one user, so
      # the limit is lifted for the tests as the integration job does.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --preset tsan-unit

  reactor-matrix:
    name: reactor-matrix (${{ matrix.reactor }})
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: *trusted-runner
    strategy:
      fail-fast: false
      matrix:
        reactor: [io_uring, epoll]
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_REACTOR: ${{ matrix.reactor }}
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      - name: io_uring probe
        run: |
          gcc -O2 tools/io_uring_probe.c -o io_uring_probe -luring
          ./io_uring_probe
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      # gtest_discover_tests appends "  # GetParam() = ..." to parameterised test names.
      # Every io_uring ring is charged to the user's RLIMIT_MEMLOCK, summed over all of that user's
      # processes (the integration job says why), and the self-hosted runners share one user, so
      # the limit is lifted for the tests as the integration job does.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --preset ci -R 'Reactors/.*/${{ matrix.reactor == 'io_uring' && 'IoUring' || 'Epoll' }}( |$)'
      # The gateway harness takes its reactor from ULW_REACTOR, which build-test leaves unset.
      - run: ctest --preset ci -R '^(Transports/GatewayUpload|GatewayTls)\.'
      - name: echo acceptance
        run: tests/load/echo_acceptance.sh build/ci ${{ matrix.reactor }} 20

  # The storage laws, the wire behaviour the S3 adapter relies on, the store's reaper, and the
  # catalog and job queue, against real servers. The integration label runs one test per core
  # (ADR-0086): every test has a scratch database, a bucket prefix or bucket and ports of its
  # own, and the one that docker-pauses the Postgres is RUN_SERIAL (tests/CMakeLists.txt), so it
  # never overlaps another. The conformance label still runs one test at a time, after it.
  # Hosted only: Postgres on fixed host port 15432, restarted by its container id, MinIO by
  # its fixed container name on 9000, LiveKit on 7880, and a locked-memory limit lifted with
  # prlimit; jobs sharing a host would collide on all of them.
  integration:
    name: integration (${{ matrix.preset }})
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: ci, cc: gcc-14, cxx: g++-14 }
          - { preset: asan, cc: clang-19, cxx: clang++-19 }
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        # Below 32768, outside the ports the runner's own outgoing connections are given
        # (ip_local_port_range 32768-60999): a fixed port inside that range is sometimes taken
        # by one, and the service then fails to start.
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.cc }}-${{ matrix.preset }}-integration
      # One test per core opens up to about 130 sessions at once (measured locally), past the
      # image's default of 100. A service container takes no command line, so the limit is set
      # with ALTER SYSTEM and the server restarted; deploy/local/compose.yaml sets the same.
      - name: Raise the test Postgres's connection limit
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG" psql -U postgres -qc "ALTER SYSTEM SET max_connections = 400"
          docker restart "$PG" >/dev/null
          for _ in $(seq 60); do
            docker exec "$PG" pg_isready -U postgres -q && break
            sleep 1
          done
          test "$(docker exec "$PG" psql -U postgres -tAc 'SHOW max_connections')" = 400
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      # The chat cluster's calls go through it (docs/adr/0087); its Redis comes with it.
      - name: Start LiveKit
        run: docker compose -f deploy/local/compose.yaml --profile calls up -d --wait livekit
      - run: cmake --preset ${{ matrix.preset }} -DULW_CONFORMANCE_LIVE=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      # Without the locked-memory limit lifted, one test per core runs out of it: the kernel
      # charges every io_uring ring (about 410 KiB at the reactor's 4096 entries) to the user's
      # RLIMIT_MEMLOCK, 8 MiB on the runner, so about 20 rings for all of that user's processes
      # together, and a ring stays charged for a moment after its process exits. A reactor that
      # cannot get a ring fails with ENOMEM (an IoUring test) or falls back to epoll (a server
      # under test). The limit is the sum over the user, so no bound sized from one test holds;
      # nothing here measures it.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --test-dir build/${{ matrix.preset }} -L integration -j "$(nproc)" --output-on-failure
        env:
          # The job context exists only in steps, not in the job's own env.
          ULW_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          # deploy/local/compose.yaml's fake key pair, as tests/call/run.sh uses it.
          LIVEKIT_API_URL: http://127.0.0.1:7880
          LIVEKIT_CLIENT_URL: ws://127.0.0.1:7880
          LIVEKIT_API_KEY: ulw-dev-key
          LIVEKIT_API_SECRET: ulw-dev-secret-testtest123-not-a-real-secret
      - name: storage conformance on both reactors
        run: |
          ULW_REACTOR=io_uring ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
          ULW_REACTOR=epoll ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml --profile calls logs minio livekit

  # Line and branch coverage of the unit and integration labels, each top-level directory
  # compared with its floor in tools/coverage-floors.txt (ADR-0080), and the SonarQube Cloud
  # analysis that reads it (ADR-0079), measured once for both (ADR-0086). The table is the step
  # summary; the HTML report is an artifact. Its own ccache key: the instrumented objects never
  # match another job's, and pull requests restore what main's last run left. On pull requests
  # from this repository (the ones the scan has a token for) and on those labelled `coverage`;
  # a fork's unlabelled pull request skips it, as it skipped both before. In both lanes
  # (docs/operations/ci-lanes.md): SonarQube Cloud's quality gate on new code is decided on the pull
  # request's analysis, so the pull request must carry it. A push to a batch/** branch measures but
  # does not scan: the batch's tree reaches main as squash commits, and main's push scans those.
  coverage:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'coverage'))
    # Hosted only: Postgres on fixed host port 55432 and MinIO, as integration, and the Sonar
    # token, which the self-hosted host never sees.
    runs-on: ubuntu-24.04
    # The unit label one test at a time (6 min on main), the integration label one test per
    # core (19 min one at a time on main), the report and the scan (2 min).
    timeout-minutes: 60
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: clang-19
      CXX: clang++-19
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
      # Ubuntu 24.04's coverage.py, by version and the .deb's SHA-256 (the archive's Packages
      # index for noble/universe lists the same hash).
      PYTHON_COVERAGE_VERSION: 7.4.4+dfsg1-0ubuntu2
      PYTHON_COVERAGE_SHA256: 259a4bb007428b0ac613cf2784153fe6e26c225e86b8be29583e6f52fecd370b
      # The Go toolchain the mock-auth image builds with: deploy/local/mock-auth/Dockerfile's
      # golang image, by the same tag and digest.
      GOLANG_IMAGE: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
      SONAR_SCANNER_VERSION: 8.1.0.6389
      # The linux-x64 zip's SHA-256: the scan action's own sonar-scanner-version file at the
      # pinned commit, Maven Central's .sha256, and a local download all agree. The action's
      # default scannerVersion at that commit is this version too.
      SONAR_SCANNER_SHA256: bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b
    steps:
      # Only whether the secret is set reaches this step, never its value; the value is in the
      # scan step's env alone. Without it (a fork's or Dependabot's pull request, or the owner
      # has not added it), on the nightly run and on a batch/** push, the scan and the reports
      # only it reads are skipped, with a notice.
      - name: Check for SONAR_TOKEN
        id: token
        env:
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "${HAS_SONAR_TOKEN:-}" = "true" ] && [ "$EVENT" != "schedule" ] &&
              [[ $REF != refs/heads/batch/* ]]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set, or this is the nightly run or a batch; skipping SonarQube Cloud analysis"
          fi
      # Full history for the scan's blame and new-code detection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-coverage
      # llvm-profdata and llvm-cov from the same llvm-toolchain-19 build as the clang-19 the
      # setup installed: a profile is only readable by the version that wrote it.
      - name: Install llvm-19, pinned to the installed clang-19
        run: |
          version=$(dpkg-query -W -f='${Version}' clang-19)
          sudo apt-get install -y -qq --no-install-recommends "llvm-19=$version"
      - name: Install coverage.py, pinned
        if: steps.token.outputs.present == 'true'
        run: |
          cd "$RUNNER_TEMP"
          apt-get download "python3-coverage=$PYTHON_COVERAGE_VERSION"
          deb=python3-coverage_${PYTHON_COVERAGE_VERSION}_amd64.deb
          echo "$PYTHON_COVERAGE_SHA256  $deb" | sha256sum --check --strict
          sudo apt-get install -y -qq --no-install-recommends "./$deb"
      # One test per core opens up to about 130 sessions at once (measured locally), past the
      # image's default of 100. A service container takes no command line, so the limit is set
      # with ALTER SYSTEM and the server restarted; deploy/local/compose.yaml sets the same.
      - name: Raise the test Postgres's connection limit
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG" psql -U postgres -qc "ALTER SYSTEM SET max_connections = 400"
          docker restart "$PG" >/dev/null
          for _ in $(seq 60); do
            docker exec "$PG" pg_isready -U postgres -q && break
            sleep 1
          done
          test "$(docker exec "$PG" psql -U postgres -tAc 'SHOW max_connections')" = 400
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      # The whole coverage build, so generated headers and sources exist and
      # build/coverage/compile_commands.json matches what was compiled and measured.
      - run: cmake --preset coverage -DULW_CONFORMANCE_LIVE=ON
      - id: build
        run: cmake --build --preset coverage
      # Writes build/coverage/coverage/ (and llvm-cov-show.txt for the scan). The integration
      # label runs one test per core, as the integration job runs it; the unit label one at a
      # time, as build-test runs it. The floors are reported, not enforced (ADR-0080); a
      # failing test fails the job, after the scan below.
      # The integration label one test per core needs the locked-memory limit lifted, as in
      # the integration job.
      - name: C++ coverage
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          tools/coverage.sh build/coverage unit integration
        env:
          ULW_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          COVERAGE_PARALLEL: integration
          # Report-only on every trigger until the floors are set from a CI run (ADR-0080).
          COVERAGE_ENFORCE: "0"
          COVERAGE_SONAR: ${{ steps.token.outputs.present == 'true' && '1' || '0' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: |
            build/coverage/coverage/html
            build/coverage/coverage/summary.json
            build/coverage/coverage/summary.md
          if-no-files-found: warn
      # Every *_test.py under coverage.py; writes build/coverage-python.xml.
      - name: Python coverage
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        run: tools/coverage-python.sh build/coverage-python.xml
      # Every Go module's tests (tools/coverage-go.sh) in the pinned golang image, as the
      # runner's user and without a network, so nothing is fetched; writes build/coverage-go.out.
      # The checkout is mounted at its own path, so the script sees the paths the scan sees.
      - name: Go coverage
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/tmp/go-build \
            -v "$PWD:$PWD" -w "$PWD" "$GOLANG_IMAGE" tools/coverage-go.sh build/coverage-go.out
      # The scanner is fetched here, checked against its SHA-256, and placed where the scan
      # action's tool cache looks (sonar-scanner-cli/<version as semver>/linux-x64 plus a
      # .complete marker), so the action never downloads it. The action is told to fetch from
      # an address that cannot resolve: if its cache layout ever stops matching this, the step
      # fails instead of downloading something unchecked.
      - name: Install the pinned SonarScanner CLI
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' && steps.build.outcome == 'success' }}
        run: |
          zip=$RUNNER_TEMP/sonar-scanner.zip
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 5 --retry-all-errors \
            --retry-delay 2 -o "$zip" \
            "https://repo1.maven.org/maven2/org/sonarsource/scanner/cli/sonar-scanner-cli/${SONAR_SCANNER_VERSION}/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
          echo "$SONAR_SCANNER_SHA256  $zip" | sha256sum --check --strict
          IFS=. read -r major minor patch build <<<"$SONAR_SCANNER_VERSION"
          cache=$RUNNER_TOOL_CACHE/sonar-scanner-cli/$major.$minor.$patch-build.$build
          rm -rf "$cache"
          mkdir -p "$cache"
          unzip -q "$zip" -d "$RUNNER_TEMP/sonar-scanner"
          mv "$RUNNER_TEMP/sonar-scanner/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64" "$cache/linux-x64"
          touch "$cache/linux-x64.complete"
          rm -f "$zip"
      # Branch and pull request parameters (sonar.branch.name, sonar.pullrequest.*) are not set
      # here: the scanner reads them from the GitHub Actions environment and event.
      # Runs whenever the build did, so a failing test still leaves the analysis on the
      # dashboard; coverage from a run with a failed test is lower than the truth. The token is
      # in this step's env and nowhere else.
      - name: SonarQube Cloud scan
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' && steps.build.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: ${{ env.SONAR_SCANNER_VERSION }}
          scannerBinariesUrl: https://scanner-download-disabled.invalid
      - if: ${{ !cancelled() }}
        run: ccache --show-stats
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml logs minio

  # The M16 and M17 acceptance: three chat_server processes on ports 9101-9103 over one
  # Postgres. Their room's owner stopped until a survivor takes over, then resumed to be fenced
  # out; clients on every node seeing one order, rate limits, retries, resume, and no body in any
  # log or table. M22's on the same cluster: 1000 MLS messages stored as ciphertext gzip cannot
  # shrink, and no plaintext anywhere. The tests are parameterised over both reactors, so one
  # run covers io_uring and epoll.
  # Hosted only: Postgres on fixed host port 15432 and the nodes on fixed ports.
  cluster:
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
      ULW_CHAT_CLUSTER_PORTS: 9101,9102,9103
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These targets alone: restored, not saved (see the setup action's ccache-save).
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
          ccache-save: "false"
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target chat_server chat_cluster_tests chat_e2ee_tests
      - run: ctest --test-dir build/ci -R '^Reactors/Chat(Cluster|E2ee)Test\.' --output-on-failure

  # M30's acceptance (tests/call/ingest.spec.mjs, ADR-0053): WHIP publishers, GStreamer's
  # whipsink among them, against the LiveKit, Redis and egress of deploy/local/compose.yaml, and a
  # relayed stream through to the live packager's playlist. On the same LiveKit, 1:1 calls through
  # the product (tests/call/direct-call.spec.mjs, ADR-0087): two chat_server nodes issue the
  # tickets, and two Chrome profiles connect with them and decode each other's media; and a group
  # call of four (tests/call/group-call.spec.mjs, ADR-0095) through an owner killed mid-call and
  # an expulsion.
  # Hosted only: LiveKit, Redis and egress on the host's network, on fixed ports and with
  # fixed container names, and Postgres on fixed host port 15432.
  ingest:
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: gcc-14
      CXX: g++-14
      # The chat nodes' scratch database (tests/call/chat-stack.mjs).
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:15432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These targets alone: restored, not saved (see the setup action's ccache-save).
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
          ccache-save: "false"
      # gst-launch and the plugins the publisher's pipeline uses, and the development files
      # whipsink builds against (fetch-whipsink.sh).
      - name: Install GStreamer
        run: |
          sudo apt-get install -y -qq --no-install-recommends gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-nice libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
      # chat-stack.mjs creates and drops its scratch database with psql.
      - run: sudo apt-get install -y -qq --no-install-recommends postgresql-client
      # A build is only good for the GStreamer it linked against and the compiler that made it;
      # fetch-whipsink.sh rebuilds whatever the key lets through that does not match either.
      - name: GStreamer version
        id: gstreamer
        run: echo "version=$(pkg-config --modversion gstreamer-webrtc-1.0)" >>"$GITHUB_OUTPUT"
      - name: Restore the whipsink build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/call/.whipsink
          key: whipsink-gst${{ steps.gstreamer.outputs.version }}-${{ hashFiles('tests/call/whipsink/*', 'tests/call/fetch-whipsink.sh') }}
      - run: tests/call/fetch-whipsink.sh
      - name: Start LiveKit, Redis and egress
        run: docker compose -f deploy/local/compose.yaml --profile calls up -d --wait livekit egress
      - run: cmake --preset ci
      - run: >-
          cmake --build --preset ci --target ulw_call_harness live_packager ulw_sandbox
          chat_server ulw_migrate ulw_devtoken
      - run: tests/call/run.sh build/ci ingest.spec.mjs direct-call.spec.mjs group-call.spec.mjs
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml --profile calls logs livekit egress

  # clang-tidy over every translation unit, with the same checks, split round-robin over the
  # sorted list: the full tree in one job took 59-95 min. Shard I/N checks files I, I+N, ...;
  # run-clang-tidy_test.sh proves the shards disjoint and complete. Shard 0 also runs the quick
  # checks. Four shards, not more: a ci run is already close to the 20 concurrent hosted jobs.
  # The quick lane (docs/operations/ci-lanes.md) runs one shard, 0/1, over the pull request's
  # changed files.
  lint:
    name: boundaries + format + tidy (${{ strategy.job-index }}/${{ strategy.job-total }})
    needs: changes
    runs-on: ubuntu-24.04
    # On a hosted runner, whatever the event: a quarter of the tree took 15-24 min there (runner
    # speed varies), over 50 on the self-hosted host, where each job has three cores and shares
    # the host with three others, and past 150 once that host's queue backed up
    # (docs/operations/ci-lanes.md, "Where jobs run"). Lint needs nothing the host has, and the
    # repository is public, so hosted minutes cost nothing. Well past 60 is a hang.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[0, 1, 2, 3]') }}
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is compiled: the build stops at the generated headers.
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-lint
          ccache: "false"
      - if: matrix.shard == 0
        run: tools/check-boundaries.sh
      - if: matrix.shard == 0
        run: tools/check-format.sh
      # M22: the E2EE phase changed neither the chat service nor the router, formatting aside:
      # phase-2 against phase-3. Until a person pushes both tags, the script says it is waiting
      # on them and succeeds.
      - name: E2EE diagnostic check
        if: matrix.shard == 0
        run: tools/e2ee_diagnostic_check.sh
      # The bridge's own checks, the generated C header's drift check among them.
      - name: OpenMLS bridge (rustfmt, clippy, cargo test)
        if: matrix.shard == 0
        working-directory: infra/e2ee/mls_ffi_bridge
        # rustup does not lock its own directory, so jobs sharing a host take turns.
        run: |
          flock -w 900 "$HOME/.rustup-install.lock" rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo test --locked --offline
      # The browser client (ADR-0098): the same checks, natively and for wasm32, and its room
      # logic against an in-memory room. Its lock adds crates the bridge's fetch does not cover.
      # The quick lane runs them only when the pull request changed clients/web-mls/.
      # The room tests run under Node, which the self-hosted host does not have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.shard == 0 && needs.changes.outputs.web-mls == 'true'
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Browser MLS client (rustfmt, clippy, cargo test, room tests)
        if: matrix.shard == 0 && needs.changes.outputs.web-mls == 'true'
        working-directory: clients/web-mls
        # rustup does not lock its own directory, so jobs sharing a host take turns.
        run: |
          flock -w 900 "$HOME/.rustup-install.lock" rustup component add rustfmt clippy
          flock -w 900 "$HOME/.rustup-install.lock" rustup target add wasm32-unknown-unknown
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline --target wasm32-unknown-unknown --lib -- -D warnings
          cargo test --locked --offline
          node --test interop/room.test.mjs
      - run: cmake --preset ci
      # Generated headers must exist before clang-tidy can parse the sources.
      - run: cmake --build --preset ci --target ulw_build_info
      # Against the real compile database, so it covers exactly the list being split.
      - name: clang-tidy sharding self-check
        run: tools/run-clang-tidy_test.sh build/ci
      - name: clang-tidy (changed files)
        if: github.event_name == 'pull_request'
        # Through the environment, not spliced into the script: a branch name is the pull
        # request author's text.
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD")
          tools/run-clang-tidy.sh --shard "$SHARD" build/ci "${changed[@]}"
      - name: clang-tidy (full tree)
        if: github.event_name != 'pull_request'
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
        run: tools/run-clang-tidy.sh --shard "$SHARD" build/ci
      # Last, and run even when a step above failed, so a branch whose decision number waits on
      # another branch still gets its format and clang-tidy results.
      - name: docs (decision numbering, routes documented)
        if: ${{ !cancelled() && matrix.shard == 0 }}
        run: python3 tools/check-docs.py

  # The WebSocket codec against the Autobahn fuzzingclient, through the echo server on each
  # reactor. run.sh pins the image by digest and fails on any verdict outside its allowlist.
  autobahn:
    name: autobahn (${{ matrix.reactor }})
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    runs-on: *trusted-runner
    strategy:
      fail-fast: false
      matrix:
        reactor: [io_uring, epoll]
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_REACTOR: ${{ matrix.reactor }}
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One target alone: restored, not saved (see the setup action's ccache-save).
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
          ccache-save: "false"
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target ulw_ws_echo_server
      # Not run.sh's fixed 9001: both reactors' jobs, and other runs', may share a host. A port
      # nothing listens on, below the ephemeral range as tests/support/reserve_port.hpp picks
      # them; one taken in between fails the run at the server's start, not silently.
      - name: Pick the echo server's port
        id: port
        run: |
          for _ in $(seq 100); do
            port=$((20000 + RANDOM % 10000))
            if [[ -z $(ss -Htln "sport = :$port") ]]; then
              echo "port=$port" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - run: tests/autobahn/run.sh build/ci
        env:
          ULW_AUTOBAHN_PORT: ${{ steps.port.outputs.port }}
      # The suite's container runs as root and writes its reports into the workspace.
      - name: Hand the reports back to the runner's user
        if: always() && runner.environment == 'self-hosted'
        run: sudo chown -R "$(id -u):$(id -g)" build/ci/autobahn || true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autobahn-reports-${{ matrix.reactor }}
          path: build/ci/autobahn

  # Five minutes per target on pushes to main and to batch/** branches; thirty on the nightly and
  # manual runs. Pull requests skip it (docs/operations/ci-lanes.md): the unit label already replays
  # the committed corpora on every build, and the batch fuzzes the tree before it reaches main.
  fuzz:
    name: fuzz
    # The full lane only (docs/operations/ci-lanes.md).
    if: github.event_name != 'pull_request'
    # Seven targets, nproc at a time: two rounds of the run length (30 min nightly) on a hosted
    # runner's four cores, three on the self-hosted host's share of three, plus the build.
    timeout-minutes: 120
    runs-on: *trusted-runner
    env:
      CC: clang-19
      CXX: clang++-19
      FUZZ_TARGETS: ws http hls toml mls sdp rtp
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the run length
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case $EVENT in
            schedule | workflow_dispatch) seconds=1800 ;;
            *) seconds=300 ;;
          esac
          echo "seconds=$seconds" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-fuzz
      - run: cmake --preset fuzz
      # All the fuzzers in one build, which shares the libraries they link.
      - run: |
          read -ra targets <<<"$FUZZ_TARGETS"
          cmake --build --preset fuzz --target "${targets[@]/%/_fuzz}"
      # Each target for the full run length on a core of its own, nproc at a time; any crash
      # fails the job. A scratch corpus per target, so what a run discovers never lands in the
      # checkout.
      - env:
          SECONDS_TO_RUN: ${{ steps.scope.outputs.seconds }}
        run: |
          read -ra targets <<<"$FUZZ_TARGETS"
          tools/run-fuzzers.sh build/fuzz fuzz-work "$SECONDS_TO_RUN" "${targets[@]}"
      - if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: |
            fuzz-work/*/artifacts
            fuzz-work/*/fuzz.log

  # Every commit, not just the tip: a secret that was committed and then removed is still one.
  # Allowlist entries are in .gitleaks.toml, each scoped to a rule and a file.
  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release, linux_x64 line.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --proto =https --proto-redir =https \
            --retry 5 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  # Offline: every manifest against pinned schemas (deploy/local/tools.sh). The server-side
  # dry run against the sandbox cluster is a step of e2e.yml, where a cluster exists.
  # The quick lane runs it only when the pull request changed deploy/
  # (docs/operations/ci-lanes.md).
  manifests:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - *clear-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq --no-install-recommends
          python3-yaml
      - run: deploy/local/validate-manifests.sh

  # The browser client's dist/ is committed (ADR-0098); rebuilt in its pinned image it must
  # match, byte for byte. The quick lane runs it only when the pull request changed
  # clients/web-mls/ (docs/operations/ci-lanes.md).
  web-mls-dist:
    needs: changes
    if: needs.changes.outputs.web-mls == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: clients/web-mls/build.sh --check

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }}/${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc-14, cxx: g++-14, preset: ci, test: ci }
          - { compiler: clang, cc: clang-19, cxx: clang++-19, preset: ci, test: ci }
          - { compiler: clang, cc: clang-19, cxx: clang++-19, preset: asan, test: unit }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.compiler }}-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.test }}
      - run: ccache --show-stats

  tsan:
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-tsan
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan-unit

  reactor-matrix:
    name: reactor-matrix (${{ matrix.reactor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        reactor: [io_uring, epoll]
    env:
      CC: gcc-14
      CXX: g++-14
      ULW_REACTOR: ${{ matrix.reactor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-ci
      - name: io_uring probe
        run: |
          gcc -O2 tools/io_uring_probe.c -o io_uring_probe -luring
          ./io_uring_probe
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      # gtest_discover_tests appends "  # GetParam() = ..." to parameterised test names.
      - run: ctest --preset ci -R 'Reactors/.*/${{ matrix.reactor == 'io_uring' && 'IoUring' || 'Epoll' }}( |$)'
      - name: echo acceptance
        run: tests/load/echo_acceptance.sh build/ci ${{ matrix.reactor }} 20

  # The storage laws, the wire behaviour the S3 adapter relies on, the store's reaper, and the
  # catalog and job queue, against real servers. Nothing here passes -j, and nothing may: the
  # pool test docker-pauses the Postgres every other catalog and queue test is using, and the
  # reaper test aborts every upload in the shared bucket older than its cutoff, conformance
  # runs included, which is also why those come after the integration label, not beside it.
  integration:
    name: integration (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: ci, cc: gcc-14, cxx: g++-14 }
          - { preset: asan, cc: clang-19, cxx: clang++-19 }
    services:
      postgres:
        # Same digest as deploy/local/compose.yaml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: testtest123
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ULW_TEST_DATABASE_URL: postgresql://postgres:testtest123@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.cc }}-${{ matrix.preset }}-integration
      - name: Start MinIO
        run: docker compose -f deploy/local/compose.yaml up -d --wait minio
      - run: cmake --preset ${{ matrix.preset }} -DULW_CONFORMANCE_LIVE=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} -L integration --output-on-failure
        env:
          # The job context exists only in steps, not in the job's own env.
          ULW_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: storage conformance on both reactors
        run: |
          ULW_REACTOR=io_uring ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
          ULW_REACTOR=epoll ctest --test-dir build/${{ matrix.preset }} -L conformance --output-on-failure
      - if: failure()
        run: docker compose -f deploy/local/compose.yaml logs minio

  lint:
    name: boundaries + format + tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-lint
      - run: tools/check-boundaries.sh
      - run: python3 tools/check-docs.py
      - run: tools/check-format.sh
      - run: cmake --preset ci
      # Generated headers must exist before clang-tidy can parse the sources.
      - run: cmake --build --preset ci --target ulw_build_info
      - name: clang-tidy (changed files)
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD")
          tools/run-clang-tidy.sh build/ci "${changed[@]}"
      - name: clang-tidy (full tree)
        if: github.event_name != 'pull_request'
        run: tools/run-clang-tidy.sh build/ci

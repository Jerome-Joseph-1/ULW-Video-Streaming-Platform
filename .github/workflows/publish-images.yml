name: publish-images

# Publishes the four images Askedin runs (video-gateway, video-worker, chat, live-packager) to
# GitHub's container registry, ghcr.io/jerome-joseph-1/ulw-<service>, tagged with the full
# commit SHA and `main`, never `latest` (deploy/askedin/RUNBOOK.md, step 4).
#
# Only a commit on main whose ci run for its push to main succeeded is published. A push to main
# starts this beside ci: the images are built and checked while ci runs, and nothing is pushed
# until the API reports that ci run's success for this very commit. A manual run publishes a
# commit already on main (its `ref`, or main's tip), under the same check. Pull requests never
# run this, so no pull request's code ever runs where the package token is.
#
# Each image is built as e2e.yml's sandbox job builds it (deploy/local/e2e-up.sh) and must pass
# the same gates there before anything is pushed: the release binaries' hardening
# (tools/check-hardening.sh) and Trivy's image gate (tools/security/trivy-image.sh). `main`
# moves only to the commit that is main's tip at push time, so a slower run of an older commit
# never takes it back. Each digest is attested (build provenance) and printed in the run's
# summary, ready to pin in the overlays.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to publish; it must resolve to a commit on main (empty for main's tip)
        type: string
        required: false
        default: ""

permissions: {}

# One publish at a time; a newer one waits rather than cancelling one that is pushing.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    # Only main's own definition of this workflow, and only in this repository (a fork has no
    # package of that name to push).
    if: github.repository == 'Jerome-Joseph-1/ULW-Video-Streaming-Platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The build and gates take most of an hour; the rest is waiting on ci, whose longest job
    # may take 150 minutes.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read # ci's runs for the commit, the gate before pushing
      packages: write # the push to ghcr.io
      id-token: write # build provenance: the OIDC token Sigstore signs with
      attestations: write # build provenance: the attestation API
    env:
      NAMESPACE: ghcr.io/jerome-joseph-1
    steps:
      - name: Resolve the commit and check it is on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            sha=$GITHUB_SHA
          else
            ref=${REF:-main}
            if [[ ! $ref =~ ^[A-Za-z0-9._/-]{1,200}$ || $ref == *..* ]]; then
              echo "ref '$ref' is not a commit, branch or tag name" >&2
              exit 1
            fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve a commit: '$sha'" >&2
            exit 1
          fi
          # Commits of $sha that main lacks: none when $sha is main or one of its ancestors.
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .behind_by)
          if [[ $behind != 0 ]]; then
            echo "$sha is not on main" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing $sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - name: Check the checkout is that commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # The same Dockerfile targets and build argument as e2e-up.sh, with the full SHA as
      # woodpecker.yml stamps it. A hosted runner needs no proxy CA, so no ca-bundle secret.
      - name: Build the images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for pair in gateway:video-gateway worker:video-worker chat:chat \
              live-packager:live-packager; do
            target=${pair%%:*}
            image=$NAMESPACE/ulw-${pair#*:}:$SHA
            echo "::group::$image"
            docker buildx build --file deploy/docker/Dockerfile --target "$target" \
              --build-arg "ULW_GIT_SHA=$SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.created=$created" \
              --label "org.opencontainers.image.title=ulw-${pair#*:}" \
              --load --tag "$image" .
            echo "::endgroup::"
          done
      # As e2e.yml's "Release binaries hardened" (docs/adr/0072).
      - name: Release binaries hardened
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for service in video-gateway video-worker chat live-packager; do
            dir=$RUNNER_TEMP/release-bin/$service
            mkdir -p "$dir"
            container=$(docker create "$NAMESPACE/ulw-$service:$SHA")
            docker cp "$container:/usr/local/bin/." "$dir"
            docker rm "$container" >/dev/null
          done
          tools/check-hardening.sh "$RUNNER_TEMP"/release-bin/*/*
      # As e2e.yml's "Image vulnerabilities": HIGH or CRITICAL with a fix available fails.
      - name: Image vulnerabilities
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TRIVY_REPORT_DIR: ${{ runner.temp }}/trivy-image
        run: >-
          tools/security/trivy-image.sh "$NAMESPACE/ulw-video-gateway:$SHA"
          "$NAMESPACE/ulw-video-worker:$SHA" "$NAMESPACE/ulw-chat:$SHA"
          "$NAMESPACE/ulw-live-packager:$SHA"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image
          path: ${{ runner.temp }}/trivy-image
          if-no-files-found: warn
      # The commit's ci run for its push to main must have succeeded; wait while it runs. The
      # API reports a re-run's latest attempt, so a successful re-run counts.
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          deadline=$((SECONDS + 170 * 60))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if jq -e 'any(.conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "ci succeeded on $SHA"
              break
            fi
            if jq -e 'length > 0 and all(.status == "completed")' <<<"$runs" >/dev/null; then
              echo "ci did not succeed on $SHA: $runs" >&2
              exit 1
            fi
            if (( SECONDS > deadline )); then
              echo "no successful ci run on $SHA in time: $runs" >&2
              exit 1
            fi
            echo "waiting for ci on $SHA: $runs"
            sleep 60
          done
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the images
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          {
            echo "### Published images"
            echo
            echo "Commit \`$SHA\`; \`main\` $([[ $tip == "$SHA" ]] && echo moved here || echo "left at $tip, main's tip")."
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for service in video-gateway video-worker chat live-packager; do
            repo=$NAMESPACE/ulw-$service
            docker push --quiet "$repo:$SHA"
            digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$repo:$SHA" | sed -n "s|^$repo@\(sha256:[0-9a-f]\{64\}\)\$|\1|p" | head -n1)
            if [[ -z $digest ]]; then
              echo "$repo:$SHA: no digest after the push" >&2
              exit 1
            fi
            if [[ $tip == "$SHA" ]]; then
              docker tag "$repo:$SHA" "$repo:main"
              docker push --quiet "$repo:main"
            fi
            echo "${service//-/_}=$digest" >> "$GITHUB_OUTPUT"
            echo "$repo@$digest" >> "$GITHUB_STEP_SUMMARY"
            echo "$repo@$digest"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.NAMESPACE }}/ulw-video-gateway
          subject-digest: ${{ steps.push.outputs.video_gateway }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.NAMESPACE }}/ulw-video-worker
          subject-digest: ${{ steps.push.outputs.video_worker }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.NAMESPACE }}/ulw-chat
          subject-digest: ${{ steps.push.outputs.chat }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.NAMESPACE }}/ulw-live-packager
          subject-digest: ${{ steps.push.outputs.live_packager }}
          push-to-registry: true
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

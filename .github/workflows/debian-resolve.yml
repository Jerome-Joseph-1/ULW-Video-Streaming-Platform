name: debian-resolve

# Temporary: the Debian worker image's checks, run before the pull request exists.
on:
  push:
    branches: [fix/ffmpeg-on-debian]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trixie-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/docker/Dockerfile --target worker-build -t ulw-worker-build .
      - name: Peak address space of the sandboxed command lines on 7.1
        run: |
          cat >"$RUNNER_TEMP/vmpeak.sh" <<'SCRIPT'
          #!/bin/bash
          # vmpeak.sh [big]: peak address space of the command lines the sandbox runs, against their limits
          set -u
          w=$(mktemp -d); cd "$w"
          peak() {
            local label=$1; shift
            bash -c "exec $*" & local p=$! pk=0 v
            while kill -0 $p 2>/dev/null; do
              v=$(awk '/VmPeak/{print $2}' /proc/$p/status 2>/dev/null); [ -n "$v" ] && pk=$v; sleep 0.02
            done
            wait $p; echo "$label: exit $? VmPeak $((pk / 1024)) MiB"
          }
          ff="ffmpeg -nostdin -v error -y"
          $ff -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 10 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -c:a aac in.mp4
          $ff -i in.mp4 -c copy -f mpegts in.ts
          $ff -i in.mp4 -an -c copy -movflags frag_keyframe+empty_moov+default_base_moof -f mp4 video.frag.mp4
          peak "test source encode (default threads, limit 1 GiB in the test)" "$ff -f lavfi -i testsrc2=size=320x180:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -g 25 -c:a aac -f mpegts src.ts"
          prlimit --as=1073741824 $ff -f lavfi -i testsrc2=size=320x180:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -g 25 -c:a aac -f mpegts src2.ts 2>/dev/null; echo "  same under a 1 GiB RLIMIT_AS: exit $?"
          peak "probe (limit 1 GiB)" "ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:stream_side_data=rotation:format=duration -of default=nw=1 -format_whitelist mov,matroska,mpegts in.mp4 >/dev/null"
          mkdir -p live; peak "live remux (limit 1 GiB)" "ffmpeg -nostdin -hide_banner -loglevel warning -nostats -analyzeduration 3000000 -probesize 15000000 -f mpegts -i pipe:0 -map 0:v:0 -map 0:a:0? -c copy -bsf:a aac_adtstoasc -f hls -hls_time 2 -hls_list_size 2 -hls_segment_type fmp4 -hls_fmp4_init_filename init_0.mp4 -hls_segment_filename live/seg_0_%d.m4s -start_number 0 -hls_flags independent_segments+temp_file live/index.m3u8 <in.ts"
          peak "recording remux with silence (limit 1 GiB)" "ffmpeg -nostdin -hide_banner -loglevel error -nostats -f mp4 -i pipe:0 -f lavfi -i anullsrc=r=48000:cl=stereo -map 0:v:0 -map 1:a:0 -shortest -c:v copy -c:a aac -f mpegts pipe:1 <video.frag.mp4 >/dev/null"
          if [[ ${1:-} == big ]]; then
            $ff -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440 -t 60 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -c:a aac big.mp4
            mkdir -p out/{1080p,720p,360p}
            peak "1080p 60 s three-rung transcode, -threads 4 (limit 4 GiB; 1.9 GB on 6.1)" "ffmpeg -nostdin -hide_banner -loglevel warning -y -i big.mp4 -filter_complex '[0:v]split=3[v1][v2][v3];[v1]scale=-2:1080[v1o];[v2]scale=-2:720[v2o];[v3]scale=-2:360[v3o]' -map '[v1o]' -c:v:0 libx264 -b:v:0 5000k -maxrate:v:0 5350k -bufsize:v:0 7500k -map '[v2o]' -c:v:1 libx264 -b:v:1 2800k -maxrate:v:1 2996k -bufsize:v:1 4200k -map '[v3o]' -c:v:2 libx264 -b:v:2 800k -maxrate:v:2 856k -bufsize:v:2 1200k -map a:0 -map a:0 -map a:0 -c:a aac -b:a 128k -ac 2 -ar 48000 -preset veryfast -profile:v main -level 4.0 -pix_fmt yuv420p -bf 0 -sc_threshold 0 -g 120 -keyint_min 120 -hls_time 4 -hls_playlist_type vod -hls_segment_type fmp4 -hls_flags independent_segments -master_pl_name master.m3u8 -var_stream_map 'v:0,a:0,name:1080p v:1,a:1,name:720p v:2,a:2,name:360p' -hls_segment_filename 'out/%v/seg_%05d.m4s' -threads 4 -nostats 'out/%v/index.m3u8'"
            peak "decode check of the output (limit 4 GiB)" "ffmpeg -nostdin -v error -format_whitelist hls,mov -i out/master.m3u8 -f null -"
            cat out/master.m3u8
          fi
          cd /; rm -rf "$w"
          SCRIPT
          chmod +x "$RUNNER_TEMP/vmpeak.sh"
          docker run --rm -v "$RUNNER_TEMP/vmpeak.sh:/vmpeak.sh:ro" -v "$PWD:/w:ro" -w /w \
            ulw-worker-build bash -c \
            'deploy/docker/apt-install-debian.sh ffmpeg=7:7.1.5-0+deb13u1 >/dev/null && /vmpeak.sh big' 2>&1 | tee vmpeak.txt
          echo '::group::results'; grep -E 'VmPeak|RLIMIT' vmpeak.txt; echo '::endgroup::'

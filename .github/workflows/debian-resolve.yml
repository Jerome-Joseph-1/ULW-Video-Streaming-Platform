name: debian-resolve

# Temporary: what snapshot.debian.org offers for the worker image's packages.
on:
  push:
    branches: [fix/ffmpeg-on-debian]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    env:
      DEBIAN_SNAPSHOT: 20260929T000000Z
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: When the security release reached the snapshot archive
        run: |
          for v in '7%3A7.1.5-0%2Bdeb13u1'; do
            /usr/lib/apt/apt-helper download-file \
              "http://snapshot.debian.org/mr/package/ffmpeg/$v/binfiles/ffmpeg/$v?fileinfo=1" /tmp/mr.json
            cat /tmp/mr.json; echo
          done
      - name: Candidates
        run: |
          deploy/docker/apt-install-debian.sh --policy \
            ffmpeg ca-certificates openssl libcurl4t64 libpq5 libssl3t64 liburing2 \
            g++-14 gcc-14 cmake ninja-build pkgconf libssl-dev libcurl4-openssl-dev libpq-dev \
            liburing-dev zlib1g-dev strace setpriv libc6 libstdc++6 libavcodec61 libx264-164
      - name: What ffmpeg pulls in
        run: |
          apt-get -o Acquire::Retries=10 update -q
          apt-get install -s --no-install-recommends ffmpeg | grep '^Inst' | wc -l
          apt-get install -s --no-install-recommends ffmpeg | grep '^Inst'

name: setup
description: Install the toolchain and restore the ccache for one job.
inputs:
  cache-key:
    description: Distinguishes ccache contents between jobs.
    required: true
runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          g++-14 clang-19 clang-tidy-19 clang-format-18 lld-19 libclang-rt-19-dev \
          ninja-build ccache mold jq pkg-config \
          libssl-dev libcurl4-openssl-dev libpq-dev liburing-dev ffmpeg python3-yaml
    # The worker runs ffmpeg in a network namespace of its own (ADR-0025). The runners'
    # AppArmor policy refuses unprivileged user namespaces, and the worker refuses to start
    # without its sandbox, so its tests would only skip.
    - name: Allow the worker sandbox's user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    # Ubuntu 24.04 runners randomise more mmap bits than TSan/ASan's shadow layout allows.
    - name: Relax mmap randomisation for sanitizers
      shell: bash
      run: sudo sysctl -w vm.mmap_rnd_bits=28
    # The OpenMLS bridge (ADR-0044) builds with cargo --locked --offline, so its crates must be
    # in the registry cache before CMake runs. Skipped on trees without the bridge.
    - name: Restore the cargo registry
      if: hashFiles('infra/e2ee/mls_ffi_bridge/Cargo.lock') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: cargo-registry-${{ hashFiles('infra/e2ee/mls_ffi_bridge/Cargo.lock') }}
    # A cold build of the bridge takes minutes; cargo rebuilds what the lock file or the
    # sources changed.
    - name: Restore the bridge's cargo build
      if: hashFiles('infra/e2ee/mls_ffi_bridge/Cargo.lock') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/*/infra/e2ee/cargo*
        key: cargo-build-${{ inputs.cache-key }}-${{ hashFiles('infra/e2ee/mls_ffi_bridge/Cargo.lock', 'infra/e2ee/mls_ffi_bridge/src/**') }}
        restore-keys: cargo-build-${{ inputs.cache-key }}-
    # rustup installs the release rust-toolchain.toml names, checked against the channel's
    # signed manifest; cargo fetch downloads exactly what Cargo.lock lists, checksums and all.
    - name: Install the pinned Rust toolchain and fetch the bridge's crates
      if: hashFiles('infra/e2ee/mls_ffi_bridge/Cargo.lock') != ''
      shell: bash
      working-directory: infra/e2ee/mls_ffi_bridge
      run: |
        rustup toolchain install --no-self-update
        cargo fetch --locked
    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.cache-key }}-
    - name: Configure ccache
      shell: bash
      run: |
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
        export CCACHE_DIR=$HOME/.cache/ccache
        ccache --set-config=max_size=400M
        ccache --zero-stats

# The whole platform on one laptop, for demos: start it with demo/up.sh, stop it with
# demo/down.sh (README.md). Nothing here is for a real deployment: the passwords and keys are
# throwaway, the token issuer signs for anyone who asks, and every port is published on
# 127.0.0.1 only.
#
# One network namespace. Every service runs in the namespace of `netns` (a pause container),
# so each reaches the others on 127.0.0.1, as deploy/local's host-network services do, but
# without host networking, which Docker Desktop on macOS does not give containers. That is what
# lets one address work from both sides:
#   - the store: the gateway signs segment URLs for http://localhost:<DEMO_S3_PORT>, which the
#     browser reaches through the published port and the services reach on loopback;
#   - LiveKit: it advertises 127.0.0.1 and its media ports, which the browser reaches through the
#     published ports and egress, the live recorder, reaches on loopback.
# The ports inside are fixed; only the published ones that must match an advertised address
# (the store's and LiveKit's media ports) follow the variables on both sides.
#
# Images. Ours default to the published :main images (public on ghcr.io, rebuilt from main by
# publish-images.yml), not pinned, so the demo shows whatever main is; DEMO_IMAGE_TAG=<sha>
# pins a build, and DEMO_BUILD=1 (up.sh) builds them from this checkout. Everything else is
# pinned by digest.
name: ulw-demo

x-ulw-db: &db postgresql://postgres:testtest123@127.0.0.1:5432/postgres
x-livekit-key: &livekit-key ulw-demo-key
x-livekit-secret: &livekit-secret ulw-demo-secret-testtest123-not-a-real-secret

x-store: &store
  ULW_STORAGE: minio
  ULW_S3_ENDPOINT: http://localhost:${DEMO_S3_PORT:-9900}
  ULW_BUCKET: ulw-demo
  ULW_S3_ACCESS_KEY_ID: ulw-demo
  ULW_S3_SECRET_ACCESS_KEY: ulw-demo-testtest123

x-in-netns: &in-netns
  network_mode: service:netns
  restart: unless-stopped
  depends_on:
    netns:
      condition: service_started

# The worker's and the packager's ffmpeg sandbox (ulw_sandbox) needs a user namespace, its own
# /proc and read-only bind mounts: Docker's default seccomp profile plus unshare, mount and
# mount_setattr (seccomp/ulw-worker.json, a copy of deploy/kubernetes/cluster/seccomp's), and an
# unmasked /proc, as the Kubernetes pods get with procMount: Unmasked.
x-sandboxed: &sandboxed
  security_opt:
    - seccomp=./seccomp/ulw-worker.json
    - systempaths=unconfined
    - apparmor=unconfined

services:
  netns:
    # registry.k8s.io/pause:3.10: holds the namespace and does nothing else.
    image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
      - "127.0.0.1:${DEMO_S3_PORT:-9900}:${DEMO_S3_PORT:-9900}"
      - "127.0.0.1:${DEMO_RTC_TCP_PORT:-7881}:${DEMO_RTC_TCP_PORT:-7881}"
      - "127.0.0.1:${DEMO_RTC_UDP_PORT:-7882}:${DEMO_RTC_UDP_PORT:-7882}/udp"

  postgres:
    <<: *in-netns
    # postgres:16 (16.15), the digest deploy/local/compose.yaml pins.
    image: docker.io/library/postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_PASSWORD: testtest123
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    <<: *in-netns
    # The community MinIO build deploy/local/compose.yaml pins (RELEASE.2026-08-04T00-00-00Z).
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--address", ":${DEMO_S3_PORT:-9900}", "--console-address", "127.0.0.1:9901"]
    environment:
      MINIO_ROOT_USER: ulw-demo
      MINIO_ROOT_PASSWORD: ulw-demo-testtest123
      # The page plays segments straight from the store (ADR-0028).
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${DEMO_S3_PORT:-9900}/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The identity provider's stand-in and the one-time setup: the signing key and its JWK set
  # (the `keys` volume, which the gateway and chat read), and the bucket.
  auth:
    <<: *in-netns
    # node:22-alpine, 2026-10.
    image: docker.io/library/node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "/demo/server.mjs"]
    environment:
      <<: *store
      ULW_S3_ENDPOINT: http://127.0.0.1:${DEMO_S3_PORT:-9900}
      JWT_ISSUER: ulw-demo
      JWT_AUDIENCE: ulw-dev
    volumes:
      - ./auth/server.mjs:/demo/server.mjs:ro
      - keys:/keys
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8070/auth/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  migrate:
    network_mode: service:netns
    image: ${DEMO_GATEWAY_LIVE_IMAGE:-ulw-demo/gateway-live:local}
    build:
      context: ./build
      dockerfile: gateway.Dockerfile
      args:
        GATEWAY_IMAGE: ${DEMO_GATEWAY_IMAGE:-ghcr.io/jerome-joseph-1/ulw-video-gateway:${DEMO_IMAGE_TAG:-main}}
        PACKAGER_IMAGE: ${DEMO_PACKAGER_IMAGE:-ghcr.io/jerome-joseph-1/ulw-live-packager:${DEMO_IMAGE_TAG:-main}}
    entrypoint: ["/usr/local/bin/ulw_migrate"]
    environment:
      ULW_DATABASE_URL: *db
    depends_on:
      postgres:
        condition: service_healthy

  # The demo's users' rooms and member lists (db/seed.sql), once the schema is there.
  seed:
    network_mode: service:netns
    image: docker.io/library/postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed.sql", "postgresql://postgres:testtest123@127.0.0.1:5432/postgres"]
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    <<: [*in-netns, *sandboxed]
    # Built by the migrate service's build section (up.sh builds it first).
    image: ${DEMO_GATEWAY_LIVE_IMAGE:-ulw-demo/gateway-live:local}
    pull_policy: never
    environment:
      <<: *store
      ULW_DATABASE_URL: *db
      ULW_LISTEN_PORT: "8081"
      ULW_DEV_MODE: "1"
      ULW_DEV_JWKS_FILE: /keys/jwks.json
      JWT_ISSUER: ulw-demo
      JWT_AUDIENCE: ulw-dev
      ULW_REACTOR: epoll
      ULW_ALLOWED_ORIGINS: http://localhost:${DEMO_PORT:-8080},http://127.0.0.1:${DEMO_PORT:-8080}
      # Every browser request arrives from the web proxy's one address.
      ULW_MAX_CONNECTIONS_PER_IP: "256"
      ULW_NEW_CONNECTIONS_PER_IP_PER_SECOND: "1000"
      ULW_REQUESTS_PER_USER_PER_MINUTE: "3000"
      ULW_LOG_LEVEL: info
      # The stream service (feat/live-publish, ADR-0092); a gateway without it ignores these.
      # The process runtime runs one live_packager child per stream in this container, hence
      # one stream at a time.
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_CLIENT_URL: ws://localhost:${DEMO_PORT:-8080}
      LIVEKIT_API_KEY: *livekit-key
      LIVEKIT_API_SECRET: *livekit-secret
      ULW_LIVE_PACKAGER: process
      ULW_LIVE_PACKAGER_BIN: /usr/local/bin/live_packager
      ULW_LIVE_PACKAGER_SCRATCH_DIR: /var/cache/ulw-live
      ULW_LIVE_PACKAGER_PORT: "9100"
      ULW_LIVE_PACKAGER_SRT: srt://127.0.0.1:9100
      ULW_LIVE_MAX_STREAMS: "1"
      ULW_LIVE_STREAMS_PER_USER_PER_HOUR: "1000"
      # LiveKit's webhooks (feat/live-webhook, ADR-0093): live on the first track, ended when
      # the publisher leaves.
      ULW_LIVE_WEBHOOK_PORT: "8090"
    volumes:
      - keys:/keys:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: [*in-netns, *sandboxed]
    image: ${DEMO_WORKER_IMAGE:-ghcr.io/jerome-joseph-1/ulw-video-worker:${DEMO_IMAGE_TAG:-main}}
    environment:
      <<: *store
      ULW_DATABASE_URL: *db
      ULW_NODE_ID: demo-worker
      ULW_FFMPEG_THREADS: "2"
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  chat:
    <<: *in-netns
    image: ${DEMO_CHAT_IMAGE:-ghcr.io/jerome-joseph-1/ulw-chat:${DEMO_IMAGE_TAG:-main}}
    environment:
      ULW_DATABASE_URL: *db
      ULW_LISTEN_PORT: "9101"
      ULW_NODE_ID: demo-chat
      ULW_NODE_ADDRESS: 127.0.0.1:9201
      ULW_DEV_LOOPBACK_NODES: "1"
      ULW_NODE_SECRET: ulw-demo-node-secret-testtest123-not-real
      ULW_DEV_MODE: "1"
      ULW_DEV_JWKS_FILE: /keys/jwks.json
      JWT_ISSUER: ulw-demo
      JWT_AUDIENCE: ulw-dev
      ULW_REACTOR: epoll
      ULW_ALLOWED_ORIGINS: http://localhost:${DEMO_PORT:-8080},http://127.0.0.1:${DEMO_PORT:-8080}
      ULW_MAX_CONNECTIONS_PER_IP: "512"
      ULW_MAX_CONNECTIONS_PER_IP_BLOCK: "1280"
      ULW_NEW_CONNECTIONS_PER_IP_PER_SECOND: "1000"
      # Calls (ADR-0087): tickets for LiveKit, which the page reaches through the web proxy.
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_CLIENT_URL: ws://localhost:${DEMO_PORT:-8080}
      LIVEKIT_API_KEY: *livekit-key
      LIVEKIT_API_SECRET: *livekit-secret
    volumes:
      - keys:/keys:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      auth:
        condition: service_healthy

  redis:
    <<: *in-netns
    # redis 7.4.6 (alpine), the digest deploy/local/compose.yaml pins: LiveKit's and egress's bus.
    image: docker.io/library/redis@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  livekit:
    <<: *in-netns
    # livekit/livekit-server v1.13.7, the digest deploy/local/compose.yaml pins (ADR-0020).
    image: docker.io/livekit/livekit-server@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ulw-demo-key: ulw-demo-secret-testtest123-not-a-real-secret
        redis:
          address: 127.0.0.1:6379
        rtc:
          # The browser is on this machine: candidates name loopback and the published ports.
          node_ip: 127.0.0.1
          use_external_ip: false
          enable_loopback_candidate: true
          tcp_port: ${DEMO_RTC_TCP_PORT:-7881}
          udp_port: ${DEMO_RTC_UDP_PORT:-7882}
        room:
          # Chat and the stream service open rooms through the server API.
          auto_create: false
        api:
          enable_psrpc_for_get_list_participants: true
        webhook:
          api_key: ulw-demo-key
          urls:
            - http://127.0.0.1:8090/livekit/webhook
        logging:
          level: info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 2s
      retries: 30

  egress:
    <<: *in-netns
    # livekit/egress v1.14.1, the digest deploy/local/compose.yaml pins (ADR-0046); about 1.5 GB
    # to download, 4.8 GB on disk. It relays a live stream's publisher to the packager over SRT.
    image: ${DEMO_EGRESS_IMAGE:-docker.io/livekit/egress@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce}
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ulw-demo-key
        api_secret: ulw-demo-secret-testtest123-not-a-real-secret
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        health_port: 7981
        template_port: 7980
        log_level: info
        # A laptop is rarely idle enough for egress's default admission (ADR-0053).
        cpu_cost:
          participant_cpu_cost: 0.1
          max_cpu_utilization: 0.99

  web:
    <<: *in-netns
    # nginx:1.29-alpine, 2026-10: the page, and one origin for the gateway, chat and LiveKit.
    image: docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      # Ready when every service the page talks to is.
      test: ["CMD", "sh", "-c", "for u in /api/v1/readyz /_demo/chat/readyz /_demo/livekit/ /auth/healthz; do wget -q -O /dev/null http://127.0.0.1:8080$$u || exit 1; done"]
      interval: 3s
      timeout: 10s
      retries: 200

volumes:
  pg:
  minio:
  keys:

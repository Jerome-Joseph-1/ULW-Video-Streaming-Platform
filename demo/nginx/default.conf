# One origin for the page: the web app, the gateway's API, chat's WebSocket, LiveKit's
# signalling and WHIP, and the demo's token issuer. All upstreams are on loopback: every
# service shares this container's network namespace (compose.yaml).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream gateway {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # The page is edited live from the checkout: never cache it.
    add_header Cache-Control "no-store" always;

    # The gateway: uploads (chunks up to 16 MiB), videos, playlists and live streams.
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 17m;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Chat's WebSocket. A browser cannot set Authorization on a WebSocket, and the demo's users
    # share one browser (so one cookie jar) in several windows, so the page passes its token as
    # ?token= and this edge turns it into the bearer header chat takes from native clients, and
    # strips it from the request. The access log leaves this location out so no token is
    # written anywhere.
    location = /rt {
        access_log off;
        set $demo_token $arg_token;
        rewrite ^ /rt? break;
        proxy_pass http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "Bearer $demo_token";
        proxy_set_header Cookie "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # LiveKit: the SDK's signalling WebSocket (calls) and WHIP (live publishing). /twirp, its
    # server API, is never routed (ADR-0050).
    location /rtc {
        access_log off;
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /whip {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # LiveKit builds the session's Location from these.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # The OpenMLS browser client (clients/web-mls/dist), when the checkout has it. The page falls
    # back to its stand-in cipher on a 404.
    location /mls/ {
        alias /repo/clients/web-mls/dist/;
        types {
            application/wasm wasm;
            text/javascript js;
        }
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8070;
    }

    # Readiness, for the healthcheck and up.sh only.
    location = /_demo/chat/readyz {
        proxy_pass http://127.0.0.1:9101/readyz;
    }
    location = /_demo/livekit/ {
        proxy_pass http://127.0.0.1:7880/;
    }
    location = /_demo/egress/ {
        proxy_pass http://127.0.0.1:7981/;
    }
}

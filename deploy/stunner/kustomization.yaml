# STUNner and LiveKit in the sandbox cluster, from deploy/kubernetes exactly as it ships,
# configured by ../local/config.env through the component every overlay uses, with only what the
# sandbox must change patched below. up.sh applies it once STUNner's CRDs are in; rendered with
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/stunner
# because the manifests live outside this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes/cluster/stunner/operator.yaml
  - ../kubernetes/cluster/stunner/dataplane.yaml
  - ../kubernetes/cluster/stunner/gatewayclass.yaml
  - ../kubernetes/base/stunner
  - ../kubernetes/base/livekit
  # LiveKit's configuration names Redis, and LiveKit does not start without it. Egress, the
  # other user of Redis, is not run here: its image is ~5 GB, and the local call suite
  # (compose.yaml) covers the relay.
  - ../kubernetes/base/livekit-redis
  - sandbox.yaml
configMapGenerator:
  - name: ulw-operator-config
    envs:
      - ../local/config.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
components:
  - ../kubernetes/components/operator-config
# up.sh loads each image into the node from a pull pinned by digest, filed under its tag only
# (images.sh), so the pods name the tag, and never pull: a tag missing from the node would
# otherwise fetch whatever the registry serves under it now.
images:
  - name: docker.io/l7mp/stunner-gateway-operator
    newTag: "1.2.1"
  - name: docker.io/livekit/livekit-server
    newTag: v1.13.7
  - name: docker.io/library/redis
    newTag: 7.4.6-alpine
patches:
  - target:
      kind: Dataplane
      name: default
    patch: |-
      - op: replace
        path: /spec/image
        value: docker.io/l7mp/stunnerd:1.2.1
      - op: replace
        path: /spec/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: stunner-gateway-operator-controller-manager|livekit|livekit-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Redis requests 50m in the base; one kind node on a 4-core runner has almost no CPU
  # left to reserve once the gateways, the worker, chat, LiveKit and STUNner's dataplane hold
  # theirs (deploy/local/cluster/chat-patch.yaml says the same of chat), so the sandbox's Redis
  # reserves next to nothing and runs on what is idle. Memory is left as the base has it.
  - target:
      kind: Deployment
      name: livekit-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
  # LiveKit's 500m is sized for the calls a real node carries; the sandbox's checks place one
  # or two. With it the node's 4000m was reserved to the last millicore, and up.sh's restart of
  # chat, which surges a fourth pod before retiring one, stayed Pending ("Insufficient cpu")
  # until its rollout timed out. 100m leaves room for that surge. The limit stays the base's,
  # so LiveKit still runs on whatever is idle.
  - target:
      kind: Deployment
      name: livekit
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
  # The shipped route answers only PUBLIC_HOSTNAME; clients reach LiveKit's /rtc as
  # 127.0.0.1:18080 (the URL chat's tickets name, up.sh), so, as for the routes in
  # ../local/cluster, it names no hostname: with one, Envoy answers 404 there.
  - target:
      kind: HTTPRoute
      name: livekit
    patch: |-
      - op: remove
        path: /spec/hostnames
  # The kind node has no load balancer: the TURN listener is a NodePort, which kind.yaml
  # publishes on the outside network as 198.18.0.1:3478. That is the address clients use, so
  # the Gateway names it; STUNner reports a Gateway Programmed only once it knows one.
  - target:
      kind: Gateway
      name: stunner
    patch: |-
      - op: add
        path: /spec/addresses
        value: [{type: IPAddress, value: 198.18.0.1}]
      - op: add
        path: /metadata/annotations/stunner.l7mp.io~1service-type
        value: NodePort
      - op: add
        path: /metadata/annotations/stunner.l7mp.io~1nodeport
        value: '{"turn-udp": 31478}'

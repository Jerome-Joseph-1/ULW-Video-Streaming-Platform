# S3 for local development and the live storage suites, on 127.0.0.1:9000.
#   docker compose -f deploy/local/docker-compose.minio.yml up -d --wait
# The credentials are throwaway; tests/support/live_s3.cpp defaults to the same pair.
#
# MinIO no longer publishes docker.io/minio/minio. This is the community build of the same
# server, RELEASE.2026-08-04T00-00-00Z, pinned by digest so a retag cannot change it.
services:
  minio:
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ulw-dev
      MINIO_ROOT_PASSWORD: ulw-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15

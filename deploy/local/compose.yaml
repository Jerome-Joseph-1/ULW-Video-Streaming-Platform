# Postgres for local development and the integration tests (label `integration`), which look
# for it at postgresql://postgres:testtest123@127.0.0.1:55432/postgres unless
# ULW_TEST_DATABASE_URL says otherwise. The password only ever guards a loopback port.
#
#   docker compose -f deploy/local/compose.yaml up -d
#   ULW_DATABASE_URL=postgresql://postgres:testtest123@127.0.0.1:55432/postgres build/ci/apps/migrate/ulw_migrate
#
# The tests that pause the server (docker pause) find it by container name, ulw-pg, or by
# ULW_TEST_PG_CONTAINER.
services:
  postgres:
    # postgres:16 (16.15), pinned by digest so every checkout tests against the same server.
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    container_name: ulw-pg
    environment:
      POSTGRES_PASSWORD: testtest123
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

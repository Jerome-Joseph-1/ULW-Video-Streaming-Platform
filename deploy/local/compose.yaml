# Backing services for local development and the live test suites. The passwords are
# throwaway and only ever guard loopback ports.
#
#   docker compose -f deploy/local/compose.yaml up -d --wait
#   ULW_DATABASE_URL=postgresql://postgres:testtest123@127.0.0.1:55432/postgres build/ci/apps/migrate/ulw_migrate
#   (started as root, the services also need ULW_ALLOW_ROOT=1, or ULW_RUN_AS_USER)
#
# The integration tests (label `integration`) look for Postgres at
# postgresql://postgres:testtest123@127.0.0.1:55432/postgres unless ULW_TEST_DATABASE_URL says
# otherwise; the tests that pause it (docker pause) find it by container name, ulw-pg, or by
# ULW_TEST_PG_CONTAINER. The live storage suites (ULW_CONFORMANCE_LIVE=ON) use MinIO on
# 127.0.0.1:9000 with the credentials below, which tests/support/live_s3.cpp defaults to.
# The call suite (tests/call/run.sh) uses the LiveKit server on 127.0.0.1:7880 with the fake API
# key below, and its live ingest spec also the recorder; they run only when asked for:
#
#   docker compose -f deploy/local/compose.yaml --profile calls up -d --wait livekit egress
services:
  postgres:
    # postgres:16 (16.15), pinned by digest so every checkout tests against the same server.
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    container_name: ulw-pg
    # The integration label runs one test per core (ctest -j), which opens more sessions at
    # once than the default 100; ci.yml raises its service container to the same.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_PASSWORD: testtest123
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    # MinIO no longer publishes docker.io/minio/minio. This is the community build of the same
    # server, RELEASE.2026-08-04T00-00-00Z, pinned by digest so a retag cannot change it.
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: ulw-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ulw-dev
      MINIO_ROOT_PASSWORD: ulw-dev-secret
      # hls.js fetches presigned segment URLs from whatever loopback port a development page
      # or the E2E suite's page server is on (ADR-0028). The server's default, spelled out so
      # it is not lost to a change of image.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      # Incomplete multipart uploads are aborted after 7 days, as R2's lifecycle rule does.
      # MinIO takes no AbortIncompleteMultipartUpload rule; this server-wide setting is its
      # equivalent, and its 24 hour default would cut short uploads the gateway allows 6 days.
      MINIO_API_STALE_UPLOADS_EXPIRY: 168h
      # `mc admin config get local api` keeps showing the stored stale_uploads_expiry=24h and
      # lists this override as a comment line: '# MINIO_API_STALE_UPLOADS_EXPIRY=168h'.
    ports:
      - "127.0.0.1:9000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15

  livekit:
    # livekit/livekit-server v1.13.7, pinned by digest (ADR-0020).
    image: docker.io/livekit/livekit-server@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: ulw-livekit
    profiles: ["calls"]
    # On the host's network, as are the recorder and its Redis: the recorder joins rooms as a
    # client, and a WHIP publisher's trickled candidates are host addresses the server must reach
    # (ADR-0053); from a bridge network neither would be reachable at the loopback address the
    # server advertises.
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # The key and secret are fake and guard nothing but loopback ports. HS256 wants a key of
      # at least 256 bits (RFC 7518 section 3.2), hence the padding.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        keys:
          ulw-dev-key: ulw-dev-secret-testtest123-not-a-real-secret
        # The bus to the recorder (egress below); LiveKit reaches egress only through Redis.
        redis:
          address: 127.0.0.1:7879
        rtc:
          # ICE candidates advertise loopback: the browsers under test run on this host. LiveKit
          # leaves loopback interfaces out of ICE unless told, and on the host's network no
          # forwarder brings loopback traffic to another interface. The media ports listen on
          # every host address, as checks towards a publisher's host candidates leave from them;
          # they carry nothing but DTLS sessions a ticket set up. STUNner fronts the SFU
          # everywhere else (ADR-0013).
          node_ip: 127.0.0.1
          enable_loopback_candidate: true
          use_external_ip: false
          tcp_port: 7881
          # One UDP port per peer connection, and a participant holds two (publish and
          # subscribe): 20 ports carry the 10 connections of five 1:1 calls, more than any local
          # run makes.
          port_range_start: 50000
          port_range_end: 50019
        room:
          # Rooms exist only because the signalling server opened them; a ticket for a room
          # that has gone must not bring it back with default settings.
          auto_create: false
        api:
          # ListParticipants from the room itself, not from its copy in Redis. Each published
          # track stores a snapshot of its participant, and two tracks published in the same
          # millisecond store theirs in either order, so the copy can keep one track for good
          # (the ingest spec saw a WHIP publisher's audio missing for 20 s on a runner). LiveKit
          # v1.13.7 marks this the coming default (pkg/config/config.go).
          enable_psrpc_for_get_list_participants: true
        # Room and participant events, signed with the key above, to a gateway started with
        # ULW_LIVE_WEBHOOK_PORT=7890 (docs/adr/0093): its stream service takes a stream live
        # when its publisher publishes and ends it when the publisher has gone. With nothing
        # listening there, LiveKit logs each failed send and drops it; nothing else changes.
        webhook:
          api_key: ulw-dev-key
          urls:
            - http://127.0.0.1:7890/livekit/webhook
        logging:
          level: info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    # redis 7.4.6 (alpine), pinned by digest. Only LiveKit and its recorder use it, as their bus.
    image: docker.io/library/redis@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    container_name: ulw-livekit-redis
    profiles: ["calls"]
    network_mode: host
    # Its ports, and the recorder's below, sit under Linux's ephemeral range (32768 and up): a
    # port in it can be held by some client socket on the host when the server starts, and the
    # recorder's health server then fails to bind without a word.
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "7879", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7879", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  egress:
    # livekit/egress v1.14.1, pinned by digest (ADR-0046): the recorder that relays a live
    # stream's publisher to the packager over SRT (ADR-0053).
    image: docker.io/livekit/egress@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    container_name: ulw-livekit-egress
    profiles: ["calls"]
    network_mode: host
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ulw-dev-key
        api_secret: ulw-dev-secret-testtest123-not-a-real-secret
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:7879
        health_port: 7981
        # Serves room composite layouts, which this project does not use; its default, spelled
        # out beside the health port.
        template_port: 7980
        log_level: info
        # A participant relay re-encodes one 720p stream, about one core. Egress admits a
        # request only while that much CPU is idle, which a laptop or a runner busy with the
        # rest of a test run often is not; the cost here keeps the local recorder from turning
        # every request away. Askedin's deployment keeps the default.
        cpu_cost:
          participant_cpu_cost: 0.1
          max_cpu_utilization: 0.99
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7981/"]
      interval: 2s
      timeout: 2s
      retries: 30

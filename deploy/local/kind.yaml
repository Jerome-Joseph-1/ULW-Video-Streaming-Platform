# The sandbox replica of Askedin's cluster: one kind node standing in for k8s-prod. e2e-up.sh
# creates it; nothing here is used against a real cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Some hosts that run the sandbox are themselves containers or nested VMs whose runtime refuses
# a negative oom_score_adj, which runc writes for every pod sandbox. Restricting containerd to
# scores no lower than its own lets pods start there and changes nothing that matters for a
# test cluster elsewhere.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.runtime"]
      restrict_oom_score_adj = true
nodes:
  - role: control-plane
    # kind v0.33.0's own node image for Kubernetes v1.37.0.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Recent kubelets refuse cgroup v1 hosts by default; the sandbox must still run on
    # them (the dev VM is one). Harmless on cgroup v2.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        failCgroupV1: false
    # Envoy's listener, published on the host's loopback only (envoy.yaml's NodePort).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
      # The WebRTC-facing ports, on the outside network's gateway address only (sandbox.sh):
      # STUNner's TURN listener (deploy/stunner, NodePort 31478), which carries every media
      # packet of every call, so it is the only UDP port published at all; and LiveKit's
      # signalling, which production routes through askedin-gateway instead.
      - containerPort: 31478
        hostPort: 3478
        listenAddress: 198.18.0.1
        protocol: UDP
      - containerPort: 30880
        hostPort: 17880
        listenAddress: 198.18.0.1
        protocol: TCP

# Postgres and MinIO run outside the cluster, as an operator's database and object store often
# do. e2e-up.sh starts them as containers on the kind network and points these
# Services at them with an EndpointSlice each, since their addresses are only known then.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ulw
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ulw
spec:
  ports:
    - name: s3
      port: 9000

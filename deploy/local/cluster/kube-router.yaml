# NetworkPolicy enforcement for the sandbox. kindnet has its own engine, but it queues packets
# to user space with nftables' `queue`, which some kernels lack (the nested VM this sandbox was
# first built on is one), and then enforces nothing without saying so. kube-router's firewall
# works with plain iptables and ipsets, so it runs here beside kindnet with its routing and
# service proxy switched off; where both enforce, they enforce the same policies.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-router
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "nodes", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-router
subjects:
  - kind: ServiceAccount
    name: kube-router
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router
    spec:
      serviceAccountName: kube-router
      # The node's own network namespace: the one whose iptables it programs.
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: kube-router
          # e2e-up.sh loads it into the node from a pull pinned by digest (images.sh).
          image: docker.io/cloudnativelabs/kube-router:v2.10.0
          imagePullPolicy: IfNotPresent
          args:
            - --run-router=false
            - --run-service-proxy=false
            - --run-firewall=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # It programs the node's iptables and ipsets, which takes these two capabilities and
          # no others; the kernel loads the netfilter modules they need on first use. Only the
          # router, switched off, would load a module itself.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate

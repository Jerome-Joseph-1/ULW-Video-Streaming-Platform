# What the sandbox changes in the egress policies, and why: MinIO serves the store on port 9000,
# and the mock auth-service's pods serve the JWKS on 8443 behind its Service's 443 (to the
# gateway and chat). Policies match a pod's own port, after the Service has translated it, so
# both ports are added (deploy/kubernetes/RUNBOOK.md, step 1, says the same of any operator's in-cluster store or
# JWKS). Everything else is as the base has it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-gateway
  namespace: ulw
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-worker
  namespace: ulw
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.244.0.0/16"]
      ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat
  namespace: ulw
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - port: 9201
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: 7880
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP

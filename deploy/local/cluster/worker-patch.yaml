# What the sandbox changes in video-worker beyond its config.env (../config.env), and why: one
# kind node on a 4-core machine cannot set aside the CPU and scratch the base requests next to
# the control plane, so the sandbox asks for less. The memory is left as the base has it: that
# is the number part B measures against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker
  namespace: ulw
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 500m
              ephemeral-storage: 2Gi
            limits:
              ephemeral-storage: 4Gi
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi

# Stands in for an identity provider: the sandbox reaches no real one.
# The gateway fetches its JWKS over https inside the cluster; test clients mint tokens through
# the Gateway at /mock-auth/token. e2e-up.sh creates the mock-auth-tls secret from a CA that
# lives only in deploy/local/.state.
apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-auth
  namespace: auth
  labels:
    app.kubernetes.io/name: mock-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-auth
    spec:
      automountServiceAccountToken: false
      # The image's own user (distroless nonroot, deploy/local/mock-auth/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-auth
          image: ulw/mock-auth:e2e
          imagePullPolicy: Never
          args:
            - -issuer=https://auth.ulw-sandbox.test
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: mock-auth-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-auth
  namespace: auth
spec:
  selector:
    app.kubernetes.io/name: mock-auth
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-auth
  namespace: auth
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mock-auth/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: mock-auth
          port: 80

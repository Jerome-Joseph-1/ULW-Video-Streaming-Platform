# What the sandbox changes in video-gateway beyond its config.env (../config.env), and why: the
# mock auth-service's certificate is signed by the sandbox CA, which replaces the system bundle
# libcurl reads, so the JWKS fetch is verified exactly as against a real identity provider's.
# The per-client limits stay at their defaults: the load check's 500 uploads from one host are
# authenticated, so its users' limits govern them, not their shared address's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-gateway
  namespace: ulw
spec:
  template:
    spec:
      containers:
        - name: gateway
          volumeMounts:
            - name: sandbox-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: sandbox-ca
          configMap:
            name: sandbox-ca

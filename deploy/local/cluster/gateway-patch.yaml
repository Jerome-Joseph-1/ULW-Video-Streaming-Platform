# What the sandbox changes in the stage video-gateway, and why:
# - images come from the node, never a registry;
# - MinIO stands in for R2, so ULW_S3_ENDPOINT replaces ULW_R2_ACCOUNT_ID;
# - the mock auth-service stands in for Askedin's, so JWKS_URL comes from the sandbox's secret
#   instead of the overlay's value;
# - the mock auth-service's certificate is signed by the sandbox CA, which replaces the system
#   bundle libcurl reads, so the JWKS fetch is verified exactly as against Askedin's.
# - kind's pod network is 10.244.0.0/16, not K3s's 10.42.0.0/16. The per-client limits stay at
#   their defaults: the load check's 500 uploads from one host are authenticated, so its users'
#   limits govern them, not their shared address's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-gateway
  namespace: apps-stage
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          imagePullPolicy: Never
      containers:
        - name: gateway
          imagePullPolicy: Never
          env:
            - name: ULW_STORAGE
              value: minio
            - name: ULW_R2_ACCOUNT_ID
              $patch: delete
            - name: ULW_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: ULW_S3_ENDPOINT
            - name: JWKS_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: JWKS_URL
            - name: ULW_TRUSTED_PROXIES
              value: "10.244.0.0/16"
          volumeMounts:
            - name: sandbox-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: sandbox-ca
          configMap:
            name: sandbox-ca

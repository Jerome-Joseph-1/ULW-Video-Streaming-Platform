# What the sandbox changes in chat beyond its config.env (../config.env), and why:
# - the mock auth-service's certificate is checked against the sandbox CA, as for video-gateway
#   (gateway-patch.yaml);
# - one kind node on a 4-core runner has almost no CPU left to reserve once the gateways, the
#   worker, LiveKit and STUNner's dataplane hold theirs (50m for each chat pod already left
#   STUNner unschedulable), so chat reserves next to nothing and runs on what is idle. Memory is
#   left as the base has it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: ulw
spec:
  template:
    spec:
      containers:
        - name: chat
          resources:
            requests:
              cpu: 10m
          volumeMounts:
            - name: sandbox-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: sandbox-ca
          configMap:
            name: sandbox-ca

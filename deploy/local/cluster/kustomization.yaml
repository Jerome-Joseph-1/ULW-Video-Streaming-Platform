# Everything the sandbox runs once Envoy Gateway's CRDs are in: a NetworkPolicy enforcer, the
# Gateway, the mock auth-service, the policies that mimic an operator's identity-header edge,
# and the parts of deploy/kubernetes/base the sandbox runs, configured by ../config.env through
# the same component every overlay uses, with only what the sandbox must change patched below.
# Rendered with
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/local/cluster
# because the base and the config live outside this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-router.yaml
  - envoy.yaml
  - mock-auth.yaml
  - edge-identity.yaml
  - backing.yaml
  - ../../kubernetes/base/video-gateway
  - ../../kubernetes/base/video-worker
  - ../../kubernetes/base/chat
  - ../../kubernetes/base/live-packager
configMapGenerator:
  - name: ulw-operator-config
    envs:
      - ../config.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
components:
  - ../../kubernetes/components/operator-config
# Images built by e2e-up.sh and loaded into the node; nothing is pulled from ghcr.io.
images:
  - name: ghcr.io/jerome-joseph-1/ulw-video-gateway
    newName: ulw/video-gateway
    newTag: e2e
  - name: ghcr.io/jerome-joseph-1/ulw-video-worker
    newName: ulw/video-worker
    newTag: e2e
  - name: ghcr.io/jerome-joseph-1/ulw-chat
    newName: ulw/chat
    newTag: e2e
patches:
  - path: gateway-patch.yaml
  - path: worker-patch.yaml
  - path: chat-patch.yaml
  - path: networkpolicy-patch.yaml
  # The shipped routes answer only PUBLIC_HOSTNAME; the sandbox is reached as 127.0.0.1:18080,
  # so its routes name no hostname.
  - target:
      kind: HTTPRoute
      name: video-gateway|chat
    patch: |-
      - op: remove
        path: /spec/hostnames

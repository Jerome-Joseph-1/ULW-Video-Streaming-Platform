# Everything the sandbox runs once Envoy Gateway's CRDs are in: a NetworkPolicy enforcer, the
# Gateway, the mock auth-service, the policies that mimic askedin-gateway, and the stage
# overlays exactly as they ship, with only what the sandbox must change patched below.
# Rendered with
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/local/cluster
# because the overlays live outside this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-router.yaml
  - envoy.yaml
  - mock-auth.yaml
  - askedin-identity.yaml
  - backing.yaml
  - ../../askedin/overlays/stage/video-gateway/deployment.yaml
  - ../../askedin/overlays/stage/video-gateway/service.yaml
  - ../../askedin/overlays/stage/video-gateway/httproute.yaml
  - ../../askedin/overlays/stage/video-gateway/networkpolicy.yaml
  - ../../askedin/overlays/stage/video-worker/deployment.yaml
  - ../../askedin/overlays/stage/video-worker/networkpolicy.yaml
  - ../../askedin/overlays/stage/chat/deployment.yaml
  - ../../askedin/overlays/stage/chat/service.yaml
  - ../../askedin/overlays/stage/chat/httproute.yaml
  - ../../askedin/overlays/stage/chat/networkpolicy.yaml
  - ../../askedin/overlays/stage/live-packager/service.yaml
  - ../../askedin/overlays/stage/live-packager/networkpolicy.yaml
# Images built by e2e-up.sh and loaded into the node; nothing is pulled from ghcr.io.
images:
  - name: ghcr.io/jerome-joseph-1/ulw-video-gateway
    newName: ulw/video-gateway
    newTag: e2e
  - name: ghcr.io/jerome-joseph-1/ulw-video-worker
    newName: ulw/video-worker
    newTag: e2e
  - name: ghcr.io/jerome-joseph-1/ulw-chat
    newName: ulw/chat
    newTag: e2e
patches:
  - path: gateway-patch.yaml
  - path: worker-patch.yaml
  - path: chat-patch.yaml
  - path: networkpolicy-patch.yaml
  # The shipped routes answer only stage's host; the sandbox is reached as 127.0.0.1:18080, so
  # its routes name no hostname.
  - target:
      kind: HTTPRoute
      name: video-gateway|chat
    patch: |-
      - op: remove
        path: /spec/hostnames

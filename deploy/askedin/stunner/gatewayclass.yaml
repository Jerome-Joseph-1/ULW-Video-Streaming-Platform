# The class every STUNner Gateway names, and the configuration they share (ADR-0013, and
# ADR-0033 for the credentials). Media clients authenticate with time-windowed TURN credentials:
# the call service mints each one from the shared secret in Secret stunner-secrets (RUNBOOK.md
# step 7) for one session, and it stops working when its window closes. STUNner's "ephemeral"
# is the same type as the "longterm" that older STUNner documentation names.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: stunner-gatewayclass
spec:
  controllerName: stunner.l7mp.io/gateway-operator
  parametersRef:
    group: stunner.l7mp.io
    kind: GatewayConfig
    name: stunner-gatewayconfig
    namespace: stunner-system
  description: TURN ingress for WebRTC media
---
apiVersion: stunner.l7mp.io/v1
kind: GatewayConfig
metadata:
  name: stunner-gatewayconfig
  namespace: stunner-system
spec:
  realm: ulw
  authType: ephemeral
  authRef:
    kind: Secret
    name: stunner-secrets
    namespace: stunner-system
  dataplane: default

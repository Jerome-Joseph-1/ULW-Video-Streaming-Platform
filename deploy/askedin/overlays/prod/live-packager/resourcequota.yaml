# How much the gateway's service account can start here, however it is driven (docs/adr/0092).
# A stream is one Job and one pod, a tenth of a core and 256Mi requested, at most a core and
# 512Mi (live-packager/job.yaml). Running pods are bounded by the streams the platform takes
# (the gateway's ULW_LIVE_MAX_STREAMS) and one more, restarting; finished pods count for
# nothing. A finished Job stays an hour for its log (its TTL), so the Job and Secret counts
# bound the streams started in about an hour, 600, far past what the per-user hourly cap lets
# through on a platform of this size, and stop a runaway well before it fills etcd. A start
# past them is refused by the API server ("exceeded quota"), which the gateway answers as the
# platform full: 503 with Retry-After.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: live-packagers
  namespace: apps-live
  labels:
    app.kubernetes.io/part-of: ulw
spec:
  hard:
    count/jobs.batch: "600"
    count/secrets: "604"
    pods: "4"
    requests.cpu: 400m
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2048Mi

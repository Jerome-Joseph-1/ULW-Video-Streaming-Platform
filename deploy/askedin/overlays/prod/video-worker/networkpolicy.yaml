# The worker serves nothing; it only reaches out to cluster DNS, Postgres (5432) and the object
# store (443). It runs ffmpeg on hostile input: sandboxed, and in a pod that can reach nothing
# else either, no other pod included. Ports, not addresses, as for the upload reaper:
# Postgres runs on the node's host and R2 is on the internet (RUNBOOK.md, 3a).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-worker
  namespace: apps
  labels:
    app.kubernetes.io/name: video-worker
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: video-worker
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Anywhere but the pod network (K3s's 10.42.0.0/16), which holds nothing the worker needs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.42.0.0/16"]
      ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP

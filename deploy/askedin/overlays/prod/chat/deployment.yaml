# Chat (ADR-0019): chat_server, three replicas sharing Postgres, each room owned by one of them
# (ADR-0015) and the rest reaching its owner over the node channel (ADR-0035). Clients hold one
# WebSocket each on /rt, which Envoy terminates TLS for (httproute.yaml); the node channel stays
# between the pods (networkpolicy.yaml). docs/adr/0083 has the shape of this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: apps
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  replicas: 3
  # One new pod at a time, and never fewer than three serving: the sockets on a pod being
  # replaced are closed by its drain and reconnect to the others, resuming from their last seq
  # (docs/integration/chat.md). A release that changes the node channel's version rolls out
  # with Recreate instead (RUNBOOK.md, section 3).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/part-of: ulw
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop 5 s + chat's 5 s drain deadline (chat::Limits::drain_deadline), with 10 s for
      # the process to unwind before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: git.askedin.com/askedin/askedin-monorepo/chat:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9101
            - name: node
              containerPort: 9201
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ULW_LISTEN_PORT
              value: "9101"
            # The node channel listens on this pod's own address only, and other chat pods
            # find it there through chat_nodes (ADR-0035). The node's name is HOSTNAME, the
            # pod's name, so a replaced pod comes back as a new node. K3s gives pods IPv4
            # addresses; an IPv6 pod network needs "[$(POD_IP)]:9201".
            - name: ULW_NODE_ADDRESS
              value: "$(POD_IP):9201"
            # As for the gateway: RuntimeDefault has no io_uring syscalls, so name the
            # reactor it would fall back to.
            - name: ULW_REACTOR
              value: epoll
            - name: JWT_AUDIENCE
              value: askedin-platform
            - name: ULW_AUTH_COOKIE
              value: auth_token
            # Askedin's auth-service JWK set (docs/integration/auth.md, Askedin).
            - name: JWKS_URL
              value: https://auth.askedin.com/.well-known/jwks.json
            # Exactly the iss Askedin's auth-service signs, compared byte for byte: no path, no
            # trailing slash (confirmed 2026-10-03, docs/integration/auth.md, Askedin).
            - name: JWT_ISSUER
              value: https://auth.askedin.com
            # The pages whose cookie may open a socket, as Askedin gave them for chat
            # (docs/integration/auth.md, Askedin). Native apps send the bearer header instead.
            - name: ULW_ALLOWED_ORIGINS
              value: https://askedin.com,https://www.askedin.com
            # Every socket comes from Envoy's data plane, so the per-client limits (ADR-0076)
            # count the address Envoy appends to X-Forwarded-For, believed only from this block,
            # as on the gateway (RUNBOOK.md, step 1).
            - name: ULW_TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: ULW_TRUSTED_PROXY_HOPS
              value: "1"
            - name: ULW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: ULW_DATABASE_URL
            # What every node proves before the node channel carries anything (ADR-0035); the
            # same value in every pod, so a change rolls them all.
            - name: ULW_NODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: ULW_NODE_SECRET
          # Memory (ADR-0036, ADR-0043, docs/integration/operations-contract.md): every queue
          # is bounded in bytes and admission bounds the rest, so the pod's memory cgroup,
          # which is also charged for the sockets' kernel buffers (64 KiB of send buffer each),
          # holds at most about 820 MiB at the very worst: 1280 sockets, full owner queues and
          # 32 node connections. The limit is the 1 GiB pod those numbers were derived for;
          # the request covers that worst case, so the node never has to reclaim a chat pod
          # below what it can legitimately reach. A node at rest holds about 50 MiB (ADR-0069).
          # CPU has no measured budget: one reactor thread does the work, beside the JWKS
          # fetch, the readiness probe and the Postgres listener. The request reserves a
          # quarter core and the limit lets the reactor take a whole one with room for the
          # rest; kubectl top under real load is the number to replace it with.
          # Disk: its log only (read-only root filesystem, no volume), sized as video-gateway's.
          resources:
            requests:
              cpu: 250m
              memory: 832Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          # /readyz answers 503 until the node has published its address, while its owner
          # heartbeat does not reach Postgres, and once it drains, so Envoy stops sending it
          # new sockets.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # /healthz is the event loop answering; three misses in a row is a wedged loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # SIGTERM starts the drain at once. The pause first gives Envoy time to see the
            # endpoint go and stop sending it new sockets.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

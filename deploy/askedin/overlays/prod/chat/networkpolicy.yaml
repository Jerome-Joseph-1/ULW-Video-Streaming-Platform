# Clients' sockets come only through Envoy's data plane, and Prometheus in namespace monitoring
# reads /metrics, both on the client port. The node port admits the other chat pods alone
# (ADR-0035): it authenticates them by a shared secret, but nothing else has a reason to try.
# Out of the pod it reaches cluster DNS, the other chat pods' node port, LiveKit's server API
# (7880), Postgres (5432) and, over 443, Askedin's JWKS, and nothing else. Ports, not addresses,
# as for the gateway: Postgres runs on the node's host (RUNBOOK.md, 3a). If JWKS_URL names an
# in-cluster Service whose pods listen on a port other than 443, that target port must be added
# here.
#
# Assumes Envoy Gateway's default layout, as video-gateway's does (RUNBOOK.md, step 1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat
  namespace: apps
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chat
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - port: node
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - port: 9201
          protocol: TCP
    # LiveKit's server API (RoomService), for calls (docs/adr/0087). Prod runs no LiveKit yet,
    # so this matches no pod until it does; its policy must then admit ULW's pods on that port,
    # as stage's does.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: 7880
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP

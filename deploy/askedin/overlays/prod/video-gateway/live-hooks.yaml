# LiveKit's webhooks to the gateway's stream service (docs/adr/0093): the gateway's second
# listener, port 8081 (ULW_LIVE_WEBHOOK_PORT), behind a Service of its own that no HTTPRoute
# names, so nothing from the internet reaches it, and admitted from LiveKit's pods alone. Every
# request is still verified against LiveKit's key pair before it is read. Prod's gateway does
# not listen there until live is turned on at phase-6 (RUNBOOK step 9); until then this admits
# LiveKit to a closed port.
apiVersion: v1
kind: Service
metadata:
  name: video-gateway-hooks
  namespace: apps
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  selector:
    app.kubernetes.io/name: video-gateway
  ports:
    - name: hooks
      port: 8081
      targetPort: 8081
      appProtocol: http
---
# Policies add up: networkpolicy.yaml admits Envoy and Prometheus to the public port, this one
# LiveKit to the webhook port and nobody else. LiveKit's own policy restricts only its ingress,
# so it may post here; egress and the packagers (in the -live namespace, behind its default
# deny) send no webhooks and are not admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-gateway-hooks
  namespace: apps
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: 8081
          protocol: TCP

# LiveKit's signalling WebSocket, the endpoint a call ticket names (the client SDK connects to
# <ticket url>/rtc), and its WHIP endpoint, the one a publisher ticket names (docs/adr/0053):
# POST /whip/v1 starts a live stream's ingest session, PATCH and DELETE on the session's
# /whip/v1/<id> trickle candidates and end it. Its server API (/twirp) stays inside the cluster:
# only the call and stream services call it.
#
# Prod names its hostnames, Askedin's prod origins (docs/integration/auth.md, Askedin): stage's
# route names none and so matches every hostname of the same askedin-gateway, and a route that
# names the hostname takes precedence over it there, so prod's clients reach prod's LiveKit
# whichever route is older. A call or publisher ticket for prod must name one of these hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit
  namespace: apps
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  parentRefs:
    - name: askedin-gateway
      namespace: apps
  hostnames:
    - askedin.com
    - www.askedin.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rtc
      backendRefs:
        - name: livekit
          port: 7880
      # A signalling connection lasts the whole call.
      timeouts:
        request: 0s
    # One request each, answered as soon as LiveKit has the session's answer or has applied
    # the candidates; the route's default timeout covers them.
    - matches:
        - path:
            type: PathPrefix
            value: /whip
      backendRefs:
        - name: livekit
          port: 7880

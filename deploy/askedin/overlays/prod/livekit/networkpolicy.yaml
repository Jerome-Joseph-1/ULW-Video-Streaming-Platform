# Media reaches LiveKit only from STUNner's relay and from egress, the recorder of a live
# stream, which joins rooms as a client from inside the cluster; signalling only through
# Envoy's data plane and, for the server API, from ULW's own pods beside it (egress among
# them). A client that learnt the pod's address from an ICE candidate still cannot send to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit
  namespace: apps
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: livekit
  policyTypes: ["Ingress"]
  ingress:
    # The stunnerd pods of stunner/gateway.yaml's Gateway, by the label the operator gives only
    # them: app=stunner alone would admit any workload that happens to use that label.
    - from:
        - podSelector:
            matchLabels:
              stunner.l7mp.io/related-gateway-name: stunner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit-egress
      ports:
        - port: rtc-udp
          protocol: UDP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ulw
      ports:
        - port: http

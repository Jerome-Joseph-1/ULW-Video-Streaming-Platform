# The SFU (ADR-0020). Browsers reach it two ways: signalling over WebSocket through
# askedin-gateway (httproute.yaml), and media only as TURN relayed by STUNner (ADR-0013): the
# ICE candidates it offers are its pod address, which only STUNner can reach, and the ICE
# servers it hands each client name STUNner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: apps
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  # One server: it is sized for one (below), and the Redis it now has (livekit-redis/, the bus
  # to egress) is unmeasured as a bus between several. Recreate, so a rollout never runs two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        app.kubernetes.io/part-of: ulw
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: docker.io/livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
          imagePullPolicy: IfNotPresent
          args: ["--node-ip=$(POD_IP)"]
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # "<api key>: <api secret>", the pair the call service signs tickets with.
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: LIVEKIT_KEYS
            # STUNner's public address, and the shared secret of its ephemeral auth
            # (stunner-secrets in stunner-system holds the same value), expanded into the
            # configuration below.
            - name: TURN_HOST
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: TURN_HOST
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: TURN_SECRET
            # Redis (livekit-redis/), the bus egress takes its requests from.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: REDIS_PASSWORD
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                rtc:
                  # Every participant's media on one UDP port, the port STUNner's UDPRoute
                  # admits. No ICE over TCP and no public address discovery: nothing but
                  # STUNner reaches the pod, and it only relays UDP.
                  udp_port: 7882
                  tcp_port: 0
                  use_external_ip: false
                  # The ICE servers every client is told to use when it joins (ADR-0037): STUNner,
                  # with a credential minted per participant from the shared secret, valid for
                  # ttl seconds. A client whose credential expires mid-call loses its relay at
                  # the next allocation refresh and reconnects with a fresh one; 4 h keeps that
                  # to calls longer than almost any, while a leaked credential still dies the
                  # same day.
                  turn_servers:
                    # Prod's STUNner listens on 3479 (stunner/gateway.yaml says why).
                    - host: $(TURN_HOST)
                      port: 3479
                      protocol: udp
                      secret: $(TURN_SECRET)
                      ttl: 14400
                room:
                  # Rooms exist only because the call service opened them.
                  auto_create: false
                # LiveKit reaches egress, the recorder of a live stream, only through Redis
                # (docs/adr/0053).
                redis:
                  address: livekit-redis:6379
                  password: $(REDIS_PASSWORD)
                api:
                  # ListParticipants from the room itself, not from its copy in Redis, which can
                  # keep a stale snapshot of a participant (deploy/local/compose.yaml says how).
                  enable_psrpc_for_get_list_participants: true
                logging:
                  level: info
          # CPU binds before bandwidth. tests/load/call_capacity measured 0.0158 cores per 1:1
          # call (two participants, each publishing and receiving ~250 packets/s of audio and
          # 720p video), so 500m carries ~31 calls and the 2-core limit ~126 (e2e run
          # 36589275099, PR #42). The same run measured 1.504 Mbit/s per call in each direction
          # against the 1.4 of ADR-0012, so 385 calls by bandwidth still stands as the ceiling
          # on a 600 Mbit/s port. Memory is ~100 MB of server plus each track's retransmission
          # cache, ~500 packets x 1.5 KB = 750 KB, for ~4 tracks per participant in a 1:1 call
          # (audio and video, sent and received): ~3 MB each. 256 MiB then holds ~50
          # participants and 1 GiB ~300; the 3 MB is still an estimate.
          # Disk: its log only (read-only root filesystem, no volume), sized as video-gateway's.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

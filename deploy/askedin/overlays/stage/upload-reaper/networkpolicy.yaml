# The reaper serves nothing and reaches out to three things: cluster DNS, Postgres and the
# object store. Ports are the restriction: Postgres runs on the node's host and R2 is on the
# internet, so neither has an address a selector could name (RUNBOOK.md, section 3a).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upload-reaper
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: upload-reaper
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: upload-reaper
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP

# Only the WebSocket endpoint is routed: /healthz, /readyz and /metrics stay inside the cluster.
# Exact, so it can shadow nothing else on the shared Gateway (LiveKit's /rtc among them).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  parentRefs:
    # The Gateway lives in apps. A stage route that leaves the namespace out attaches to
    # nothing and every request 404s, with no error anywhere.
    - name: askedin-gateway
      namespace: apps
  # Stage's host, unconfirmed by Askedin (RUNBOOK.md, open decisions): stage and prod share
  # askedin-gateway, so a route without hostnames would also answer prod's.
  hostnames:
    - stage.askedin.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /rt
      backendRefs:
        - name: chat
          port: 80
      # A socket lasts as long as its token (docs/adr/0073); chat pings a quiet one after 30 s
      # and closes it after 75 s, so Envoy imposes no timeout of its own.
      timeouts:
        request: 0s

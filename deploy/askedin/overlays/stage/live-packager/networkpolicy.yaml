# A packager's SRT listener is the only network-facing code of a stream (ADR-0046): it admits
# LiveKit's recorder (egress) alone, on its UDP port. Egress ships in livekit-egress/; its
# pods carry app.kubernetes.io/name: livekit-egress, the label this policy admits. The
# passphrase and stream id are checked at the SRT handshake anyway; this keeps everything else
# from trying.
# Out of the pod it reaches cluster DNS, Postgres (5432, to queue a stream's recording as a
# video) and the object store (443), and nothing else, no other pod included: ffmpeg runs
# inside it on bytes a publisher sent. Ports, not addresses, as for the worker: Postgres runs on
# the node's host and R2 is on the internet (RUNBOOK.md, 3a).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: live-packager
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: live-packager
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: live-packager
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit-egress
      ports:
        - port: 9000
          protocol: UDP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Anywhere but the pod network (K3s's 10.42.0.0/16), which holds nothing the packager needs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.42.0.0/16"]
      ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP

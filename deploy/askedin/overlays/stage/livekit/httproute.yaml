# LiveKit's signalling WebSocket, the endpoint a call ticket names (the client SDK connects to
# <ticket url>/rtc). Its server API (/twirp) stays inside the cluster: only the call service
# calls it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  parentRefs:
    - name: askedin-gateway
      namespace: apps
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rtc
      backendRefs:
        - name: livekit
          port: 7880
      # A signalling connection lasts the whole call.
      timeouts:
        request: 0s

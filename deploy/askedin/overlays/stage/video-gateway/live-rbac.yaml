# The gateway's own account (docs/adr/0092). It may do nothing in apps-stage: its one Role is in the
# packagers' namespace, apps-stage-live (live-packager/rbac.yaml), where it creates each live stream's
# Job and Secret, held to a packager's shape by live-packager/admission-policy.yaml. Its token is
# mounted into the gateway's container alone (video-gateway/deployment.yaml), not the pod's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: video-gateway
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
automountServiceAccountToken: false

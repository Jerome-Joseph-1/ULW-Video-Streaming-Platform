# Only Envoy's data plane may open connections to the gateway, and Prometheus in namespace
# monitoring, for /metrics. The gateway never trusts
# x-user-* headers anyway (it verifies the token itself), but nothing else in the cluster has
# a reason to reach it past the Gateway's TLS and routing.
#
# Assumes Envoy Gateway's default layout: data-plane pods in envoy-gateway-system, labelled
# app.kubernetes.io/component=proxy. Confirm on the cluster before the first apply (RUNBOOK.md);
# with the wrong selector every request through the Gateway times out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-gateway
  namespace: apps-stage
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http

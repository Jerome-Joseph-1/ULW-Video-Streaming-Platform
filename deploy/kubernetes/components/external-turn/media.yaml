# LiveKit's media port on the node's public address, for the external TURN service's relays
# alone (docs/adr/0109). LiveKit cannot itself be a TURN client, so a relay outside the cluster
# reaches it here: the one inbound port of the external mode. Only the provider's relay
# addresses may send to it, twice over: the LoadBalancer's source ranges, which K3s's ServiceLB
# enforces on the node, and the NetworkPolicy, which enforces them at the pod whatever load
# balancer is in front. The two lists must be the same (validate-manifests.sh checks it); the
# node's own firewall should hold the same rule (RUNBOOK.md, step 7, "External TURN").
#
# The lists below are Cloudflare's published IPv4 ranges (https://www.cloudflare.com/ips-v4),
# for TURN_PROVIDER=cloudflare: its TURN relays allocate IPv4 addresses only, and Cloudflare
# does not publish their ranges apart. Another provider's relay ranges replace them, by a patch
# in the overlay. Port: MEDIA_UDP_PORT, which LiveKit also listens on and advertises.
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  namespace: ulw
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  type: LoadBalancer
  # The relay's address reaches the pod intact: the NetworkPolicy below can only check sources
  # it can see, and LiveKit answers the address the relay really sends from.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: livekit
  loadBalancerSourceRanges:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
  ports:
    - name: rtc-udp
      port: 7882
      targetPort: rtc-udp
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-media
  namespace: ulw
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: livekit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 173.245.48.0/20
        - ipBlock:
            cidr: 103.21.244.0/22
        - ipBlock:
            cidr: 103.22.200.0/22
        - ipBlock:
            cidr: 103.31.4.0/22
        - ipBlock:
            cidr: 141.101.64.0/18
        - ipBlock:
            cidr: 108.162.192.0/18
        - ipBlock:
            cidr: 190.93.240.0/20
        - ipBlock:
            cidr: 188.114.96.0/20
        - ipBlock:
            cidr: 197.234.240.0/22
        - ipBlock:
            cidr: 198.41.128.0/17
        - ipBlock:
            cidr: 162.158.0.0/15
        - ipBlock:
            cidr: 104.16.0.0/13
        - ipBlock:
            cidr: 104.24.0.0/14
        - ipBlock:
            cidr: 172.64.0.0/13
        - ipBlock:
            cidr: 131.0.72.0/22
      ports:
        - port: rtc-udp
          protocol: UDP

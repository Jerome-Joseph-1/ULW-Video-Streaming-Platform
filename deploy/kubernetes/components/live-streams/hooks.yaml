# LiveKit's webhooks to the gateway's stream service (docs/adr/0093): the gateway's second
# listener, port 8081 (ULW_LIVE_WEBHOOK_PORT, set by kustomization.yaml's patch), behind a
# Service of its own that no HTTPRoute names, so nothing from the internet reaches it, and
# admitted from LiveKit's pods alone. Every request is still verified against LiveKit's key pair
# before it is read. base/livekit/deployment.yaml posts to it by the Service's name, in the same
# namespace.
apiVersion: v1
kind: Service
metadata:
  name: video-gateway-hooks
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  selector:
    app.kubernetes.io/name: video-gateway
  ports:
    - name: hooks
      port: 8081
      targetPort: hooks
      appProtocol: http
---
# Policies add up: base/video-gateway/networkpolicy.yaml admits Envoy and Prometheus to the
# public port, this one LiveKit to the webhook port and nobody else. LiveKit's own policy
# restricts only its ingress, so it may post here; egress and the packagers (in LIVE_NAMESPACE,
# behind its default deny) send no webhooks and are not admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-gateway-hooks
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: hooks
          protocol: TCP

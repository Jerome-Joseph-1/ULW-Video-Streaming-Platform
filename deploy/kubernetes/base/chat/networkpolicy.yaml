# Clients' sockets come only through Envoy's data plane, and Prometheus in namespace monitoring
# reads /metrics, both on the client port. The node port admits the other chat pods alone
# (ADR-0035): it authenticates them by a shared secret, but nothing else has a reason to try.
# Out of the pod it reaches cluster DNS, the other chat pods' node port, LiveKit's server API
# (7880), Postgres (5432) and, over 443, the identity provider's JWKS and the browsers' push
# services (Web Push for calls, docs/adr/0097), and nothing else. Ports, not addresses, as for the
# gateway: Postgres may run outside the cluster (RUNBOOK.md, 3a), and the push services are
# Google's, Mozilla's, Apple's and Microsoft's fleets, whose addresses no policy can list. Which
# push hosts chat sends to is ULW_PUSH_HOSTS; that it never reaches a private, loopback or
# link-local address over 443 is chat's own check at connect time (docs/adr/0097). If
# JWKS_URL names an in-cluster Service whose pods listen on a port other than 443, that target
# port must be added here.
#
# Assumes Envoy Gateway's default layout, as video-gateway's does (RUNBOOK.md, step 1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat
  namespace: ulw
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chat
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - port: node
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - port: 9201
          protocol: TCP
    # LiveKit's server API (RoomService), for calls (docs/adr/0087); livekit's own policy
    # admits ULW's pods on that port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: 7880
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 443
          protocol: TCP

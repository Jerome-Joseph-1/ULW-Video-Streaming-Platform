# Clients' sockets only. The node channel (9201) has no Service: each pod publishes its own
# address in chat_nodes and the others dial it there (ADR-0035).
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: ulw
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  selector:
    app.kubernetes.io/name: chat
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/ws

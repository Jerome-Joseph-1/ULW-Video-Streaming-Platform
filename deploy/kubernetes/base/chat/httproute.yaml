# Only the WebSocket endpoint is routed: /healthz, /readyz and /metrics stay inside the cluster.
# Exact, so it can shadow nothing else on the shared Gateway (LiveKit's /rtc among them).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: ulw
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: ulw
spec:
  parentRefs:
    # The operator's Gateway (GATEWAY_NAME and GATEWAY_NAMESPACE in config.env). A route that
    # leaves out a namespace other than its own attaches to nothing and every request 404s,
    # with no error anywhere.
    - name: public-gateway
      namespace: gateway-system
  # PUBLIC_HOSTNAME in config.env. Environments often share one Gateway, so a route without
  # hostnames would also answer the other environments' hosts.
  hostnames:
    - video.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /rt
      backendRefs:
        - name: chat
          port: 80
      # A socket lasts as long as its token (docs/adr/0073); chat pings a quiet one after 30 s
      # and closes it after 75 s, so Envoy imposes no timeout of its own.
      timeouts:
        request: 0s

# What the gateway's service account may create in the packagers' namespace (docs/adr/0092): a
# packager Job of exactly live-packager/job.yaml's shape, and that Job's Secret. RBAC lets it
# create Jobs, whose pods could otherwise run any image with any Secret of the namespace; this
# policy is what keeps a compromised gateway from doing so. Cluster-scoped, so named after the
# environment (<NAMESPACE>-live-packagers, components/operator-config), and bound to that one
# account in that one namespace; every other user, the RUNBOOK's by-hand start included, is
# untouched.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ulw-live-packagers
  labels:
    app.kubernetes.io/part-of: ulw
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: from-the-gateway
      expression: request.userInfo.username == 'system:serviceaccount:ulw:video-gateway'
  variables:
    - name: isJob
      expression: request.resource.resource == 'jobs'
    # A stream's id, a UUIDv7 in its text form: the Job's name, and its Secret's after the
    # prefix. Exact, so that no name of another kind (live-packager-secrets) passes for one.
    # The Secret every packager reads its database URL and store keys from (LIVE_PACKAGER_SECRET
    # in config.env).
    - name: sharedSecret
      expression: "'live-packager-secrets'"
    - name: stream
      expression: "'[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'"
  validations:
    # Jobs: a packager, named after its stream.
    - expression: >-
        !variables.isJob || object.metadata.name.matches('^' + variables.stream + '$')
      message: a packager Job is named after its stream, a UUIDv7
    - expression: >-
        !variables.isJob ||
        (has(object.metadata.labels) &&
         'app.kubernetes.io/name' in object.metadata.labels &&
         object.metadata.labels['app.kubernetes.io/name'] == 'live-packager' &&
         'app.kubernetes.io/instance' in object.metadata.labels &&
         object.metadata.labels['app.kubernetes.io/instance'] == object.metadata.name)
      message: a packager Job is labelled live-packager, its instance its own name
    - expression: >-
        !variables.isJob ||
        (size(object.spec.template.spec.containers) == 1 &&
         object.spec.template.spec.containers[0].image.startsWith(
           'ghcr.io/jerome-joseph-1/ulw-live-packager:'))
      message: a packager Job runs one container, of the packager's image
    - expression: >-
        !variables.isJob ||
        ((!has(object.spec.template.spec.initContainers) ||
          size(object.spec.template.spec.initContainers) == 0) &&
         (!has(object.spec.template.spec.ephemeralContainers) ||
          size(object.spec.template.spec.ephemeralContainers) == 0))
      message: a packager Job has no init or ephemeral containers
    # The image's own entrypoint, nothing else run in it.
    - expression: >-
        !variables.isJob ||
        object.spec.template.spec.containers.all(c, !has(c.command) && !has(c.args))
      message: a packager runs its image's entrypoint, with no command or arguments
    # Its DNS name is the one the relay dials, <stream>.live-packager.<namespace>; nothing
    # chooses where it runs or what it may evict.
    - expression: >-
        !variables.isJob ||
        (has(object.spec.template.spec.hostname) &&
         object.spec.template.spec.hostname == object.metadata.name &&
         has(object.spec.template.spec.subdomain) &&
         object.spec.template.spec.subdomain == 'live-packager')
      message: a packager's hostname is its stream, under the live-packager subdomain
    - expression: >-
        !variables.isJob ||
        (!has(object.spec.template.spec.nodeName) &&
         !has(object.spec.template.spec.priorityClassName))
      message: a packager Job names no node and no priority class
    - expression: >-
        !variables.isJob || !has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v, has(v.emptyDir))
      message: a packager Job mounts emptyDir volumes only
    - expression: >-
        !variables.isJob ||
        (has(object.spec.template.spec.automountServiceAccountToken) &&
         object.spec.template.spec.automountServiceAccountToken == false &&
         (!has(object.spec.template.spec.serviceAccountName) ||
          object.spec.template.spec.serviceAccountName == 'default'))
      message: a packager Job runs as the default account, with no token mounted
    - expression: >-
        !variables.isJob ||
        (has(object.spec.template.spec.hostUsers) &&
         object.spec.template.spec.hostUsers == false &&
         !(has(object.spec.template.spec.hostNetwork) && object.spec.template.spec.hostNetwork) &&
         !(has(object.spec.template.spec.hostPID) && object.spec.template.spec.hostPID) &&
         !(has(object.spec.template.spec.hostIPC) && object.spec.template.spec.hostIPC))
      message: a packager Job runs in a user namespace, on none of the node's namespaces
    - expression: >-
        !variables.isJob ||
        object.spec.template.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
          !has(c.envFrom))
      message: a packager's container gains no privilege and takes no whole Secret
    - expression: >-
        !variables.isJob ||
        object.spec.template.spec.containers.all(c, !has(c.env) ||
          c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            e.valueFrom.secretKeyRef.name in
              [variables.sharedSecret, 'live-packager-' + object.metadata.name]))
      message: a packager reads the packagers' Secret and its own stream's Secret only
    # Secrets: a stream's, of the one plain type, owned by its stream's Job, never rewritten.
    - expression: >-
        variables.isJob ||
        (object.metadata.name.matches('^live-packager-' + variables.stream + '$') &&
         object.type == 'Opaque')
      message: the gateway makes only streams' Secrets, live-packager-<stream>, Opaque
    - expression: >-
        variables.isJob ||
        (has(object.metadata.ownerReferences) &&
         size(object.metadata.ownerReferences) == 1 &&
         object.metadata.ownerReferences[0].apiVersion == 'batch/v1' &&
         object.metadata.ownerReferences[0].kind == 'Job' &&
         'live-packager-' + object.metadata.ownerReferences[0].name == object.metadata.name)
      message: a stream's Secret is owned by its stream's Job and nothing else
    - expression: >-
        variables.isJob || request.operation != 'UPDATE' ||
        ((has(object.data) ? object.data : {}) == (has(oldObject.data) ? oldObject.data : {}) &&
         object.type == oldObject.type)
      message: an update of a stream's Secret changes its metadata only
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ulw-live-packagers
  labels:
    app.kubernetes.io/part-of: ulw
spec:
  policyName: ulw-live-packagers
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ulw-live

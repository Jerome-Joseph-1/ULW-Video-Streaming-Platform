# The gateway's own account (docs/adr/0092). It may do nothing in NAMESPACE: its one Role is in
# the packagers' namespace, LIVE_NAMESPACE (live-packager/rbac.yaml), where it creates each live
# stream's Job and Secret, held to a packager's shape by live-packager/admission-policy.yaml. No
# token is mounted unless components/live-streams turns live streams on, and then into the
# gateway's container alone, not the pod's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: video-gateway
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
automountServiceAccountToken: false

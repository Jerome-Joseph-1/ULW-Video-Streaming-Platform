# The VOD gateway: resumable uploads into the object store, video state from Postgres, tokens
# verified in-process against the identity provider's JWKS (ADR-0018). Envoy terminates TLS, so
# it serves plain HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-gateway
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  replicas: 2
  # One new pod at a time, and never fewer than two serving: a client whose upload lands on a
  # pod being replaced resumes against the other (HEAD for the offset, PATCH from there).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-gateway
        app.kubernetes.io/part-of: ulw
    spec:
      # Its own account (serviceaccount.yaml), whose token nothing mounts here: the one Role it
      # has is for live streams, which components/live-streams turns on (docs/adr/0092).
      serviceAccountName: video-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop 5 s + the gateway's 30 s drain deadline (Limits::drain_deadline), with 10 s
      # for the process to unwind before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Every rollout, a rollout restart included, migrates the schema with the image it is
      # about to run (docs/adr/0031). Migrations only ever add, so the pod still on
      # the old image keeps working against the new schema until it is replaced.
      initContainers:
        - name: migrate
          image: ghcr.io/jerome-joseph-1/ulw-video-gateway:main
          imagePullPolicy: Always
          command: ["/usr/local/bin/ulw_migrate"]
          env:
            - name: ULW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: ULW_DATABASE_URL
          # One libpq connection running a handful of DDL statements. The CPU limit only
          # bounds a runaway: it is the pod's init phase, so it takes nothing from the gateway.
          # Disk: its log only (read-only root filesystem, no volume), sized as the gateway's
          # below.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gateway
          image: ghcr.io/jerome-joseph-1/ulw-video-gateway:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ULW_LISTEN_PORT
              value: "8080"
            - name: ULW_TRANSPORT
              value: plain
            # Docker's default seccomp profile, which RuntimeDefault profiles derive from, has
            # no io_uring syscalls (seccomp/ulw-worker.json shows the same list), so the gateway
            # would fall back to epoll anyway; naming it keeps the log from reporting a fallback.
            - name: ULW_REACTOR
              value: epoll
            # The object store (config.env: STORAGE, R2_ACCOUNT_ID or S3_ENDPOINT, BUCKET). The
            # location the backend does not use stays empty, which counts as unset.
            - name: ULW_STORAGE
              value: r2
            - name: ULW_R2_ACCOUNT_ID
              value: ""
            - name: ULW_S3_ENDPOINT
              value: ""
            - name: ULW_BUCKET
              value: ulw-media
            # The identity provider (config.env, docs/integration/auth.md): its JWK set over
            # https, the iss its tokens carry, compared byte for byte, and the aud it puts in
            # tokens meant for ULW. None has a default against a JWKS: a wrong value refuses
            # every token.
            - name: JWKS_URL
              value: https://id.example.com/.well-known/jwks.json
            - name: JWT_ISSUER
              value: https://id.example.com
            - name: JWT_AUDIENCE
              value: ulw
            - name: ULW_JWT_SUBJECT_CLAIM
              value: sub
            # The operator's backend's tokens (SERVICE_CLAIM, SERVICE_SCOPE, SERVICE_CLIENT_ID
            # in config.env; ADR-0097). No scope: no token is the service's, and its API answers
            # 403. Empty claim: `scope`.
            - name: ULW_SERVICE_CLAIM
              value: ""
            - name: ULW_SERVICE_SCOPE
              value: ""
            - name: ULW_SERVICE_CLIENT_ID
              value: ""
            - name: ULW_AUTH_COOKIE
              value: auth_token
            # The web app's pages. A browser sends Origin on every cookie POST, PATCH and DELETE;
            # without the page listed here those writes are refused 403 (ADR-0078).
            - name: ULW_ALLOWED_ORIGINS
              value: https://video.example.com
            # Every connection comes from Envoy's data plane, so the per-client limits count the
            # address Envoy appends to X-Forwarded-For, believed only from peers in this block:
            # the cluster's pod network (POD_CIDR in config.env; RUNBOOK.md step 1 checks it).
            # One proxy, Envoy, stands in front, so the client is the last entry; anything left
            # of it is the client's own.
            - name: ULW_TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: ULW_TRUSTED_PROXY_HOPS
              value: "1"
            - name: ULW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: ULW_DATABASE_URL
            - name: ULW_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: ULW_S3_ACCESS_KEY_ID
            - name: ULW_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: video-gateway-secrets
                  key: ULW_S3_SECRET_ACCESS_KEY
          # Sized from the 1 GB gateway box (brief 8.1, docs/adr/0027). One upload connection
          # costs ~428 KB: ~180 KB in the process, 128 KiB + 16 KiB of socket buffers and a
          # ~100 KB backend socket, all charged to the pod's memory cgroup. At the 448 uploads
          # admission allows, 448 x 428 KB = 192 MB, plus 50 MB of binary and arenas and the
          # 16 MiB receive ring, is ~260 MB. The box budgets 600 MB for connections because
          # the per-connection terms carry a /3 safety factor; the request is that budget
          # (systemd's MemoryHigh=600M) and the limit systemd's MemoryMax=700M, so the kernel
          # kills the pod where it would have killed the unit.
          # CPU has no budget in 8.1 to derive from. The process runs one reactor thread and
          # four offload threads (ULW_OFFLOAD_THREADS) that mostly wait on sockets and Postgres,
          # so the request reserves half a core and the limit lets all five threads run at
          # once; kubectl top under 500 concurrent uploads is the number to replace it with.
          # Disk: its log and nothing else, as the root filesystem is read-only and no volume
          # is mounted. The kubelet keeps at most 5 x 10 MiB of a container's log
          # (containerLogMaxFiles and containerLogMaxSize at their defaults), which the request
          # covers; the limit leaves room above that before the pod is evicted.
          resources:
            requests:
              cpu: 500m
              memory: 600Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "2"
              memory: 700Mi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          # /readyz answers 503 once the gateway starts draining, and while Postgres or the
          # store is unreachable, so Envoy stops sending it new requests.
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # /healthz is the event loop answering; three misses in a row is a wedged loop.
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # SIGTERM stops the listener at once. The pause first gives Envoy time to see the
            # endpoint go and stop opening connections to it.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

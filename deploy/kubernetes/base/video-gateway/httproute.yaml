# Only the public API is routed: /api/v1/healthz, /api/v1/readyz and /metrics stay inside the
# cluster, and prefixes this narrow cannot shadow another service's /api routes on the shared
# Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: video-gateway
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  parentRefs:
    # The operator's Gateway (GATEWAY_NAME and GATEWAY_NAMESPACE in config.env). A route that
    # leaves out a namespace other than its own attaches to nothing and every request 404s,
    # with no error anywhere.
    - name: public-gateway
      namespace: gateway-system
  # PUBLIC_HOSTNAME in config.env. Environments often share one Gateway, so a route without
  # hostnames would also answer the other environments' hosts.
  hostnames:
    - video.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/uploads
        - path:
            type: PathPrefix
            value: /api/v1/videos
      backendRefs:
        - name: video-gateway
          port: 80
      # Envoy's default 15 s route timeout would cut off any chunk slower than 15 s, and a
      # chunk may legitimately take 1024 s at the gateway's 8 KiB/s rate floor. The gateway
      # enforces its own header, body-rate and 6 h backstop timeouts, so Envoy imposes none.
      timeouts:
        request: 0s
    # Live playlists (docs/integration/live.md): one short GET, answered from the gateway's
    # manifest cache or one storage read, and never held open, so Envoy's ordinary bound stands.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/live
      backendRefs:
        - name: video-gateway
          port: 80
      timeouts:
        request: 15s
    # The operator's backend's grants (docs/integration/videos-and-playback.md, ADR-0097): short
    # requests that only a service token passes, so Envoy's ordinary bound stands here too.
    # Routed publicly because the backend usually calls from outside the cluster; the gateway
    # takes only a bearer token whose scope (and, with SERVICE_CLIENT_ID, client) is the
    # backend's. To narrow it further, move this rule into an HTTPRoute of its own (say
    # video-gateway-service, with this route's parentRefs and hostnames) and attach an Envoy
    # Gateway SecurityPolicy that admits only the backend's addresses (RUNBOOK section 4):
    #
    #   apiVersion: gateway.envoyproxy.io/v1alpha1
    #   kind: SecurityPolicy
    #   metadata:
    #     name: video-gateway-service
    #     namespace: ulw
    #   spec:
    #     targetRefs:
    #       - group: gateway.networking.k8s.io
    #         kind: HTTPRoute
    #         name: video-gateway-service
    #     authorization:
    #       defaultAction: Deny
    #       rules:
    #         - action: Allow
    #           principal:
    #             clientCIDRs:
    #               - 203.0.113.0/24   # the backend's egress addresses
    #
    # A backend inside the cluster needs no route at all: delete this rule, call the
    # video-gateway Service directly, and admit its pods in networkpolicy.yaml.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/service/videos
      backendRefs:
        - name: video-gateway
          port: 80
      timeouts:
        request: 15s
---
# The gateway closes a keep-alive connection that sits idle for its 10 s header timeout. If
# Envoy kept pooled upstream connections longer, it would sometimes send a request down one the
# gateway was closing and answer the client 503; retiring them after 5 s idle closes that race.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: video-gateway
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: video-gateway
  timeout:
    http:
      connectionIdleTimeout: 5s

apiVersion: v1
kind: Service
metadata:
  name: video-gateway
  namespace: ulw
  labels:
    app.kubernetes.io/name: video-gateway
    app.kubernetes.io/part-of: ulw
spec:
  selector:
    app.kubernetes.io/name: video-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http

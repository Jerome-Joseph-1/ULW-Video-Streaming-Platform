# LiveKit's recorder (egress, docs/adr/0053): for each live stream the stream service starts a
# participant egress that joins the stream's room as a client, re-encodes the publisher's tracks
# and relays them over SRT to the stream's packager (docs/adr/0046, 0083). It takes requests
# from LiveKit through Redis only, so it serves nothing: no Service, no route. Its pods carry
# app.kubernetes.io/name: livekit-egress, the only pods the packager's NetworkPolicy admits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress
  namespace: ulw
  labels:
    app.kubernetes.io/name: livekit-egress
    app.kubernetes.io/part-of: ulw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-egress
        app.kubernetes.io/part-of: ulw
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # A relay in progress ends with its pod: the packager then sees its caller go and ends
      # the stream (RUNBOOK.md step 9). Give one a minute to finish what it is sending.
      terminationGracePeriodSeconds: 60
      containers:
        - name: egress
          # livekit/egress v1.14.1, the image deploy/local/compose.yaml's calls profile runs.
          image: docker.io/livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
          imagePullPolicy: IfNotPresent
          # The service itself, under the image's tini, without its entrypoint script: that
          # script starts PulseAudio, which only the Chrome-based (room composite and web)
          # egress uses, and deletes files outside the home directory, which a read-only root
          # filesystem refuses. A participant egress, the only kind ULW asks for, needs neither.
          command: ["/tini", "--", "egress"]
          ports:
            - name: health
              containerPort: 9090
          env:
            # The image's user is uid 1001; the pod runs as 10001, which has no passwd entry,
            # so the home directory is named here, an empty volume below.
            - name: HOME
              value: /home/egress
            - name: XDG_RUNTIME_DIR
              value: /home/egress
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: LIVEKIT_API_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfu-secrets
                  key: REDIS_PASSWORD
            - name: EGRESS_CONFIG_BODY
              value: |
                api_key: $(LIVEKIT_API_KEY)
                api_secret: $(LIVEKIT_API_SECRET)
                ws_url: ws://livekit:7880
                redis:
                  address: livekit-redis:6379
                  password: $(REDIS_PASSWORD)
                health_port: 9090
                template_port: 7980
                log_level: info
                # cpu_cost stays egress's default (participant_cpu_cost: 2 cores, admitted only
                # while that much of the limit below is idle): docs/adr/0053 measured 0.5 to 1
                # core per stream, so the default leaves room for the 720p re-encode.
          # One stream at a time in the base (overlays/production takes two): egress counts its
          # cores from the limit, admits a participant egress only while 2 of them are idle under
          # its 80% ceiling, so 3 cores admit one and refuse a second (Unavailable from the relay).
          # Each stream takes 0.5 to 1 core and ~300 MB (docs/adr/0053), so the request is one
          # stream's worst case and the memory limit one stream with room. Disk: logs and the
          # handler's temporary files.
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "3"
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/egress
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
